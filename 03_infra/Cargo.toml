[package]
name        = "typst-infra"
description = "I/O implementations for the Typst compiler"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
typst-core = { path = "../01_core" }
thiserror  = { workspace = true }
# comemo: eval() tracking. Promovido de [dev-dependencies] a
# [dependencies] no Passo 113 (ADR-0046) quando `pipeline.rs` expôs
# `eval_to_module_with_sink` como API pública consumível pelo 04_wiring.
comemo     = { workspace = true }
# `EcoString`: P207D (M9c) precisa do tipo em `CountingIntrospector`
# para delegar `Introspector::page_numbering(...) -> Option<&EcoString>`.
# Antes era dev-dep apenas; promovido aqui por ser usado na impl
# trait production.
ecow       = { workspace = true }
# `clap` foi removido no Passo 117 (ADR-0049): `ColorWhen` e
# `resolve_colored_with` migraram para L2 (`02_shell/src/cli.rs`),
# onde a CLI realmente vive. L3 voltou a ser I/O puro.
ttf-parser  = { workspace = true }  # ADR-0019 — parsing de fontes
rustybuzz   = { workspace = true }  # ADR-0019 — shaping de texto
unicode-bidi = { workspace = true } # P484 — re-order de runs RTL
unicode-script = { workspace = true } # P534 — segmentação por script para fallback
fontdb        = "0.23"              # P515 — descoberta automática de fontes do sistema
subsetter     = "0.2.6"             # P874 — subsetting TrueType/CFF para PDF (mesma versão do vanilla Typst 0.15.0)
time          = { workspace = true }  # ADR-0021 — today() em SystemWorld
# P753 — fontes embutidas do vanilla (Libertinus Serif, New Computer Modern, ...)
typst-assets  = { workspace = true }
toml          = { workspace = true }  # P681 — parse do manifesto typst.toml (entrypoint) em resolve_package
imagesize   = "0.12"                # leitura de cabeçalho de imagem — L3 apenas
image       = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }  # P833 (#17) — gif/webp (paridade vanilla)
flate2      = "1.0"                 # compressão Zlib para PNG /FlateDecode
# P870 — rasterização PNG e exportação SVG
tiny-skia   = "0.12"                # canvas 2D / rasterização PNG
pixglyph    = "0.6.1"               # rasterização de glifos (PNG)
bytemuck    = "1"                   # cast seguro de bytes para tiny-skia
xmlwriter   = "0.1.0"               # geração de SVG
base64      = "0.22"                # imagens embutidas em SVG
itoa        = "1"                   # serialização de inteiros em SVG
ryu         = "1"                   # serialização de floats em SVG
getrandom   = "0.2"                 # P615 — bytes aleatórios para DocumentID/InstanceID do XMP
wasmi       = { version = "=1.0.9", default-features = false, features = ["simd"] }  # P698 — runtime WASM de plugins (versão exacta do vanilla, Cargo.lock:3938-3943); `simd` expõe `wasm_relaxed_simd(false)`; L3 apenas. P819 — `default-features = false` alinha com o vanilla (Cargo.toml.original:149): sem a feature default `wat`, o erro de parse WASM bate verbatim ("magic header not detected…" vs erro do parser WAT).
# P763a — download automático de pacotes @preview
ureq        = { workspace = true }  # cliente HTTP síncrono
tar         = { workspace = true }  # extracção de pacotes .tar.gz
fastrand    = { workspace = true }  # nomes de directórios temporários atómicos
serde       = { workspace = true }  # deserialização do índice de pacotes
serde_json  = { workspace = true }  # índice de pacotes remoto em JSON

[dev-dependencies]
# (P207D 2026-05-12: `ecow` promovido a `[dependencies]` porque
# `CountingIntrospector::page_numbering` delega `Option<&EcoString>`.
# Sem entries em dev-dependencies remanescentes — tests P140B
# continuam a usar transitivamente via `[dependencies]`.)
regex = { workspace = true }  # P603 — parsing isolado da árvore /Outlines em testes
