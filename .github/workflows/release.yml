# Based on ripgrep's release action:
# https://github.com/BurntSushi/ripgrep/blob/master/.github/workflows/release.yml

name: Build Release Binaries
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build-release:
    needs: validate
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      TYPST_COMMIT_SHA: ${{ github.sha }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
          cross: true
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
          cross: true
        - target: armv7-unknown-linux-musleabi
          os: ubuntu-latest
          cross: true
        - target: riscv64gc-unknown-linux-gnu
          os: ubuntu-latest
          cross: true
        - target: x86_64-apple-darwin
          os: macos-latest
          cross: false
        - target: aarch64-apple-darwin
          os: macos-latest
          cross: false
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          cross: false
        - target: aarch64-pc-windows-msvc
          os: windows-latest
          cross: false

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
    - run: rustup target add ${{ matrix.target }}

    - name: Run Cross
      if: ${{ matrix.cross }}
      run: |
        cargo install cross --git https://github.com/cross-rs/cross.git --locked --rev 085092ca01d6ac9f5a0b612d9e68bcdf1e50f7ee
        cross build --locked -p typst-wiring --bin typst --release --target ${{ matrix.target }}

    - name: Run Cargo
      if: ${{ !matrix.cross }}
      run: cargo build --locked -p typst-wiring --bin typst --release --target ${{ matrix.target }}

    - name: Package binary with provenance and checksums
      run: python lab/tools/ci/package_release.py --target ${{ matrix.target }} --builder ${{ matrix.cross && 'cross' || 'cargo' }}

    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: github.event_name == 'workflow_dispatch'
      with:
        name: typst-${{ matrix.target }}
        path: "lab/target/release-packages/typst-${{ matrix.target }}.*"
        if-no-files-found: error
        retention-days: 3

    - uses: ncipollo/release-action@2c591bcc8ecdcd2db72b97d6147f871fcd833ba5 # v1.14.0
      if: github.event_name == 'release'
      with:
        artifacts: "lab/target/release-packages/typst-${{ matrix.target }}.*"
        allowUpdates: true
        omitNameDuringUpdate: true
        omitBodyDuringUpdate: true
        omitPrereleaseDuringUpdate: true
