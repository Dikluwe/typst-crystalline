name: Continuous integration
on:
  push:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-matrix:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: ". -> lab/target/product"
      - name: Install linter used by integration tests
        run: cargo install --locked --git https://github.com/Dikluwe/tekt-linter --rev 12797073972e375d9ab078cf6750c8b30b71e2b9 crystalline-lint
      - name: Install Linux export observers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf librsvg2-bin imagemagick
      - name: Checkout pinned language oracle
        if: runner.os == 'Linux'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: typst/typst
          ref: 64c5e8c02fe0394d913ead36e42ef8c1334d2107
          path: lab/ci-oracle
          persist-credentials: false
      - name: Build and record pinned oracle
        if: runner.os == 'Linux'
        run: |
          python3 lab/tools/ci/build_oracle.py --source lab/ci-oracle --receipt lab/results/oracle-build.json
          echo "TYPST_VANILLA=$GITHUB_WORKSPACE/lab/ci-oracle/target/release/typst" >> "$GITHUB_ENV"
      - name: Preserve oracle provenance
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: oracle-provenance
          path: lab/results/oracle-build.json
          if-no-files-found: error
      - run: cargo build --workspace --all-targets --locked
      # Export contract fixtures explicitly require Linux tmpfs in their L0.
      # Execute the complete suite on Linux; Windows compiles all test targets.
      - if: runner.os == 'Linux'
        run: TMPDIR="$(mktemp -d /dev/shm/tekt-ci.XXXXXX)" cargo testit --no-fail-fast -- --test-threads=1
      - if: runner.os == 'Windows'
        run: cargo run --locked -p typst-wiring --bin typst -- --version

  checks:
    name: Clippy, formatting and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: ". -> lab/target/product"
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo fmt --check --all
      - if: ${{ !cancelled() }}
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  check-32-bit:
    name: Check 32-bit Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - run: rustup target add i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo check --locked --workspace --target i686-unknown-linux-gnu

  lineage:
    name: Tekt lineage and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: ". -> lab/target/product"
      - name: Install published, pinned Tekt linter
        run: cargo install --locked --git https://github.com/Dikluwe/tekt-linter --rev 12797073972e375d9ab078cf6750c8b30b71e2b9 crystalline-lint
      - name: Check mature repository layout and links
        run: python3 lab/tools/ci/check_mature_layout.py
      - run: python3 -m unittest discover -s lab/tools/ci
      - name: Architecture report
        run: |
          mkdir -p lab/results
          crystalline-lint . --format sarif > lab/results/lineage.sarif
      - name: Strict forward lineage, ownership and nuclei
        if: ${{ !cancelled() }}
        run: crystalline-lint . --checks v1,v5,v15,v26 --fail-on warning
      - name: Strict reverse lineage
        if: ${{ !cancelled() }}
        run: python3 lab/tools/ci/check_reverse_lineage.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: tekt-lineage
          path: lab/results/lineage.sarif
          if-no-files-found: error

  tests:
    # Retains the aggregate check name used by branch protection. Canceled or
    # skipped prerequisites cannot make it green or authorize publication.
    name: Tests
    runs-on: ubuntu-latest
    needs: [test-matrix, checks, check-32-bit, lineage]
    if: always()
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values())'
