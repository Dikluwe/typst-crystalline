[project]
root = "."

[languages]
rust = { grammar = "tree-sitter-rust", enabled = true }

# Mapeados — arquivos aqui são analisados e devem ter layer
[layers]
L0  = "00_nucleo"
L1  = "01_core"
L2  = "02_shell"
L3  = "03_infra"
L4  = "04_wiring"

# Excluídos — ignorados intencionalmente, não disparam V8
[excluded]
build   = "target"
vcs     = ".git"
cargo   = ".cargo"
lab     = "lab"     # quarentena — código original, não enforça regras cristalinas
benches = "benches" # infra de benchmark — fora da topologia de camadas (ADR-0115)
tools = "tools" # scripts e resultados de benchmark/diagnóstico — fora da topologia de camadas
temp_p664 = "temp_p664" # artefactos temporários da auditoria P664
temp_p776 = "temp_p776" # artefactos temporários da validação P776
temp_p935 = "temp_p935" # artefactos temporários da investigação P935 (fontdb benchmark isolado)
temp_p1021 = "p1021" # artefactos temporários da auditoria de prompts (scripts de parsing + partições)
temp_p1022 = "p1022" # artefactos temporários do fatiamento de stdlib/text (medições de co-mudança)
temp_p1026 = "p1026" # artefactos temporários do gate de delimitadores de grelha (medição de output)
temp_p1030 = "p1030" # artefactos temporários do alcance de `#set math.*` (medição de pares elemento/parâmetro)

[excluded_files]
license  = "LICENSE"
notice   = "NOTICE"
readme   = "README.md"
citation = "CITATION.cff"
cargo_lock   = "Cargo.lock"
clippy_toml  = "clippy.toml"
rustfmt_toml = "rustfmt.toml"
contributing = "CONTRIBUTING.md"
dockerfile   = "Dockerfile"

# Rust module name → layer
[module_layers]
entities  = "L1"
contracts = "L1"
compiler  = "L1"
shell     = "L2"
infra     = "L3"

# Portas públicas de L1
[l1_ports]
entities  = "entities"
contracts = "contracts"
compiler  = "compiler"

[rules]
V0  = { level = "fatal" }
V1  = { level = "error" }
V2  = { level = "error" }
V3  = { level = "error" }
V4  = { level = "error" }
V5  = { level = "warning" }
V6  = { level = "warning" }
V7  = { level = "warning" }
V8  = { level = "fatal" }
V9  = { level = "error" }
V10 = { level = "fatal" }
V11 = { level = "warning" }  # Passo 5 — SystemWorld em L3 ainda não existe
V12 = { level = "warning" }
V13 = { level = "error" }
V14 = { level = "error" }
V16 = { level = "error" }

# Externos autorizados em L1 — whitelist type-level (DEBT-43, P440).
# Cada secção é uma crate; `types` lista os itens (tipos, funções, traits,
# módulos) explicitamente autorizados. Itens não listados de crates listadas
# disparam V14.

[l1_allowed_external.thiserror]
types = ["Error"]  # derive em tipos de erro de domínio L1

[l1_allowed_external.comemo]
types = ["memoize", "track", "Track", "Tracked", "TrackedMut", "Validate", "analyze"]  # ADR-0001 / ADR-0074 / P699 (memoize em PluginFunc::call)

[l1_allowed_external.unicode_ident]
types = ["is_xid_continue", "is_xid_start"]  # ADR-0010

[l1_allowed_external.unicode_math_class]
types = ["class", "MathClass"]  # ADR-0011

[l1_allowed_external.unicode_script]
types = ["Script", "UnicodeScript"]  # ADR-0012

[l1_allowed_external.unicode_segmentation]
types = ["UnicodeSegmentation"]  # ADR-0013

[l1_allowed_external.unicode_normalization]
types = ["UnicodeNormalization"]  # P692 — str.normalize() (NFC/NFD/NFKC/NFKD); computação pura sobre strings, sem I/O

[l1_allowed_external.rustc_hash]
types = ["FxBuildHasher", "FxHasher", "FxHashMap", "FxHashSet"]  # ADR-0018

[l1_allowed_external.time]
types = ["Date", "Month", "Time", "OffsetDateTime", "from_calendar_date", "try_from", "from_hms", "now_utc"]  # ADR-0021

[l1_allowed_external.indexmap]
types = ["IndexMap", "default"]  # ADR-0023

[l1_allowed_external.ecow]
types = ["EcoString", "EcoVec"]  # ADR-0024 / ADR-0035 — EcoMap/EcoArc NÃO autorizados

[l1_allowed_external.hypher]
types = ["Lang", "hyphenate", "from_iso"]  # ADR-0057

[l1_allowed_external.icu_segmenter]
types = ["LineSegmenter", "LineSegmenterBorrowed", "options::LineBreakOptions"]  # P756 — segmentação de linha CJK/Thai (dados estáticos)

[l1_allowed_external.regex]
types = ["Regex", "new"]  # ADR-0077

# grupo loading (data import) — ADR-0111 (P387); decode puro, paridade do Value de saída
[l1_allowed_external.serde_json]
types = ["Value", "from_slice"]  # ADR-0111 — decode_json

[l1_allowed_external.saphyr]
types = ["Yaml", "Scalar", "LoadableYamlNode"]  # ADR-0111 — decode_yaml

[l1_allowed_external.toml]
types = ["Value", "from_str"]  # ADR-0111 — decode_toml

[l1_allowed_external.ciborium]
types = ["value", "Value", "from_reader", "into_writer", "de::Error"]  # ADR-0111 — decode_cbor; de::Error: formatação do erro no formato vanilla (P823)

[l1_allowed_external.roxmltree]
types = ["Document", "Node", "parse"]  # ADR-0111 — decode_xml

[l1_allowed_external.csv]
types = ["ReaderBuilder", "new"]  # ADR-0111 — decode_csv

[l1_allowed_external.rust_decimal]
types = ["Decimal", "prelude", "RoundingStrategy", "MathematicalOps"]  # ADR-0112 (P399); P817 — round com estratégia away-from-zero + checked_powi (paridade calc decimal)

[l1_allowed_external.hayagriva]
types = [
    "BibliographyDriver", "CitationItem", "CitationRequest", "CitePurpose",
    "ElemChild", "ElemChildren", "Entry", "Formatted", "Formatting",
    "Library", "RenderedBibliography", "BibliographyRequest", "new",
    "archive", "ArchivedStyle", "locales",
    "citationberg", "Display", "IndependentStyle", "Locale", "Style", "FontStyle", "FontVariant", "FontWeight", "TextDecoration",
    "CitationFormat", "StyleCategory",
    "citationberg::CitationFormat", "citationberg::StyleCategory",
    "io", "from_biblatex_str", "from_yaml_str",
    "types", "Person",
]  # ADR-0062 (P418)

[l1_allowed_external.syntect]
types = ["highlighting", "parsing", "easy", "Color", "FontStyle", "Style", "StyleModifier", "SyntaxSet", "Theme", "ThemeItem", "ThemeSettings"]  # P785a

[l1_allowed_external.two_face]
types = ["syntax", "extra_no_newlines"]  # P785a

# lorem byte-parity — P805: mesma crate do vanilla (0.9.1); Markov chain
# determinística (ChaCha20Rng seed 97 interno da crate); computação pura sobre
# strings, sem I/O. Cadeia construída por chamada (L1 proíbe estado global).
[l1_allowed_external.lipsum]
types = ["MarkovChain", "LOREM_IPSUM", "LIBER_PRIMUS", "new", "learn", "iter_from"]

# P937 — mmap como referência estável de bytes sem cópia. L1 apenas recebe o
# tipo já construído por L3; nunca cria mmap nem faz I/O de ficheiros.
[l1_allowed_external.memmap2]
types = ["Mmap"]


