tekt = 1
kind = "nucleus"
id = "expression-source-identity"
title = "Identidade causal de fontes de expressão e documento"

[[claims]]
id = "distinct-origins"
level = "must"
statement = "No caminho Source-based de avaliação contextual, documento, expressão e arquivos físicos diferentes possuem FileIds distintos no mesmo World. Diagnósticos e traces conservam o Source causal; nomes, textos iguais e ordem das fases não substituem identidade."

[[claims]]
id = "allocated-in-infra"
level = "must"
statement = "SystemWorld aloca e publica Sources transientes por instância, usando o mesmo contador serializado dos arquivos físicos. Nenhum FileId publicado é reciclado ou sobrescrito por exaustão; L1 recebe Source pronto e não inventa IDs, consulta IDs arbitrários ou mantém interner global."

[[claims]]
id = "source-is-not-io-base"
level = "must"
statement = "A Source da expressão identifica sintaxe e diagnósticos; a base inicial de read/import continua world.main(). Callbacks e imports conservam suas próprias origens e bases lexicais. Documento stdin tem Source registrado e base na raiz fornecida."

[[claims]]
id = "transient-not-file"
level = "must-not"
statement = "Sources transientes não entram no mapa canônico de arquivos físicos nem em dependencies(), não provocam leitura do caminho marcador e não colidem com arquivos reais chamados <input-expression> ou <stdin>. Source e bytes transientes são resolvíveis durante a vida do World."

[[claims]]
id = "single-context-compilation"
level = "must"
statement = "A fachada contextual Source-based usa a compilação existente e seu introspector final, sem segunda execução do programa, inferência pelo diagnóstico ou reconstrução do índice para reparar origens. Features, limites, scopes, fases, ordem de warnings e serialização conservam seus contratos vigentes."
