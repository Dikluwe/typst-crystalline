tekt = 1
kind = "nucleus"
id = "page-counter-snapshot"
title = "Estado realizado do contador de páginas por ocorrência e documento"

[[claims]]
id = "document-scope"
level = "must"
statement = "Cada snapshot de Page pertence a um documento e uma geração. Current e final de uma ocorrência não herdam updates nem total de documentos vizinhos. HTML não consome páginas físicas de documentos paginados."

[[claims]]
id = "realized-fold"
level = "must"
statement = "O estado realizado combina init Page, updates efetivamente inseridos em ordem causal e avanços físicos do documento. Um update posterior não altera leituras atuais anteriores; final inclui updates posteriores e páginas finais sem ocorrência. Não derivar final apenas do número de páginas ou do último logical_number do PageStore."

[[claims]]
id = "snapshot-lifecycle"
level = "must"
statement = "Current e final são produzidos conjuntamente a partir da mesma contribuição, posições e partição documental. Substituir ou invalidar conteúdo, posição, documento ou callback invalida a geração; snapshots parciais não certificam estabilidade. Replay consulta a mesma fórmula da leitura original. Não reduzir o orçamento de estabilização nesta correção."

[[claims]]
id = "domain-boundary"
level = "must"
statement = "L1 dobra estados e executa callbacks pelo Engine já injetado, sem I/O ou estado global. L3 fornece limites e posições realizados e compõe gerações, sem duplicar a fórmula de CounterUpdate. Snapshots de páginas não substituem as fontes originais de shaping/exportação."
