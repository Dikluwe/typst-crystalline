tekt = 1
kind = "nucleus"
id = "stdlib-primitive-calls"
title = "Convenções comuns das chamadas de constructors primitivos"

[[claims]]
id = "native-abi"
level = "must"
statement = "Cada constructor recebe EvalContext, Args, World e FileId e devolve SourceResult<Value>."

[[claims]]
id = "pure-l1"
level = "must"
statement = "A construção é pura em L1: não executa I/O nem depende de efeitos de World ou FileId."

[[claims]]
id = "consume-call"
level = "must"
statement = "Cada forma aceita consome explicitamente seus argumentos; posicionais ou nomeados estranhos produzem diagnóstico em vez de serem descartados silenciosamente."

[[claims]]
id = "typed-result"
level = "must"
statement = "Uma chamada válida devolve o variant de Value correspondente ao constructor chamado."

[[claims]]
id = "owner-specific-coercion"
level = "must"
statement = "Formas, coerções e mensagens específicas pertencem ao prompt proprietário de cada constructor, não a este núcleo."
