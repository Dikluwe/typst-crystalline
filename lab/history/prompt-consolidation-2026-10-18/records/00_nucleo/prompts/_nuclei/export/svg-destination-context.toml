tekt = 1
kind = "nucleus"
id = "svg-destination-context"
title = "Contexto de destinos internos para SVG paginado"

[[claims]]
id = "same-page-registry"
level = "must"
statement = "O contexto SVG de uma página deriva labels e posições do PagedDocument e inclui somente destinos pertencentes à página exportada."

[[claims]]
id = "closed-edge"
level = "must"
statement = "Uma aresta LinkTarget::Destination só é emitida como link interno quando o mesmo contexto contém um nó de destino correspondente e resolvido."

[[claims]]
id = "single-identity"
level = "must"
statement = "A aresta e o nó usam a mesma identidade local determinística; a ortografia concreta do id não é observável da linguagem."

[[claims]]
id = "no-dangling-cross-page"
level = "must-not"
statement = "Destino ausente, cross-page ou sem rota externa explícita é emitido como fragmento href pendente ou como falso link preservado."

[[claims]]
id = "routing-authority"
level = "must"
statement = "Política de nomes de ficheiro, bundle ou rota cross-page pertence ao caller de composição e não é inventada pelo exporter SVG de uma página."
