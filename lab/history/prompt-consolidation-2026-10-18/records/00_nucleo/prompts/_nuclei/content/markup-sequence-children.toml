tekt = 1
kind = "nucleus"
id = "markup-sequence-children"
title = "Filhos imediatos de Sequence interpolada em ContentBlock"

[[claims]]
id = "immediate-child"
level = "must"
statement = "Ao formar um valor ContentBlock, uma Sequence interpolada contribui um filho imediato, preservando seus próprios filhos e ordem. A normalização de coleção vazia ou com um único filho permanece vigente; não há achatamento recursivo dos filhos do valor."

[[claims]]
id = "distinct-operations"
level = "must"
statement = "Concatenação por + e acumulação de valores conservam suas regras próprias de operandos imediatos. A coleta do valor de markup não pode simular concatenação recursiva nem alterar aliases, Source ou corpos Styled/Located/Realized/ShowRecipe. A composição do fluxo realizado conserva sua rota de normalização e captura causal."
