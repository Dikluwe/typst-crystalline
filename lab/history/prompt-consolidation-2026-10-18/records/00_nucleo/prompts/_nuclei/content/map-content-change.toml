tekt = 1
kind = "nucleus"
id = "content-map-change-proof"
title = "Prova de ausência de mudança no mapeamento de Content"

[[claims]]
id = "absence-proof"
level = "must"
statement = "Nos helpers de mapeamento com prova de mudança, None certifica que nenhum descendente efetivamente visitado nem o próprio nó exigiu substituição ou reconstrução. Some transporta materialização ou substituição; sem prova suficiente, a reconstrução conservadora continua permitida."

[[claims]]
id = "explicit-substitution"
level = "must"
statement = "Some devolvido pelo callback é sempre substituição explícita, inclusive quando contém valor igual ou compartilha o mesmo armazenamento do argumento. Essa substituição deve propagar-se aos ancestrais visitados."

[[claims]]
id = "no-inferred-change"
level = "must-not"
statement = "Igualdade de Content, hashes, texto ou endereços não podem decidir se o callback ou um descendente substituiu conteúdo."

[[claims]]
id = "causal-walk"
level = "must"
statement = "O mapeamento conserva a ordem e as fronteiras de visita já owned, visita cada ocorrência efetiva uma vez, entrega o nó após os filhos ao callback bottom-up, não reprocessa a substituição e interrompe no primeiro erro sem visitar irmãos ou ancestrais posteriores."

[[claims]]
id = "owned-preservation"
level = "must"
statement = "Reconstruções conservam os campos, metadados, spans, presença e opções que o owner determina não transformar. Ausência de substituição permite conservar o armazenamento compartilhado; não altera observação da linguagem nem suprime efeitos dos callbacks."

[[claims]]
id = "lazy-vectors"
level = "must"
statement = "Nos mapas de slices e linhas que propagam essa prova, o vetor de saída só é materializado após a primeira mudança comprovada. Prefixo e irmãos não substituídos conservam seus conteúdos compartilhados no resultado."

[[claims]]
id = "static-ownership"
level = "must"
statement = "O despacho de Content permanece estático e exaustivo no enum fechado. A lógica de cada elemento permanece no consumer de seu prompt proprietário; o protocolo não cria método público de trait, campo, variante, vtable, estado global, I/O ou mudança de fase."
