id = "table-cell-projection"
title = "Projeção da célula já representada"

[[claims]]
id = "native-identity"
level = "must"
statement = "A identidade pública da célula é cell; func e show reconhecem native_table_cell por identidade tipada real."

[[claims]]
id = "known-fields"
