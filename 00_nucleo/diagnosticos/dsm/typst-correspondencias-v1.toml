tekt_comparison_map = 1

# Movimentos estruturais. A lente exige igualdade literal do sufixo restante;
# estas regras não afirmam equivalência funcional.
[[prefix]]
antes = "typst_eval"
depois = "typst_core::compiler::eval"

[[prefix]]
antes = "typst_syntax::ast"
depois = "typst_core::entities::ast"

[[prefix]]
antes = "typst_layout"
depois = "typst_core::compiler::layout"

[[prefix]]
antes = "typst_layout::math"
depois = "typst_core::compiler::math::layout"

[[prefix]]
antes = "typst_library::foundations"
depois = "typst_core::compiler::stdlib::foundations"

# Exemplo real de divisão mecânica 1:N. O estado continua unknown até uma
# sonda funcional específica sustentar uma alegação mais forte.
[[correspondencia]]
id = "eval-apply-binary"
antes = ["typst_eval::ops::apply_binary"]
depois = [
  "typst_core::compiler::eval::eval_expr",
  "typst_core::compiler::eval::operators::eval_binary_op",
  "typst_core::compiler::eval::operators::arithmetic::apply_binary",
  "typst_core::compiler::eval::operators::equality::apply_binary",
  "typst_core::compiler::eval::operators::ordering::apply_binary",
]
relacao = "divisao"
alegacao = "declarada-fechada"
evidencias = [
  "00_nucleo/diagnosticos/p1212-sondas.tsv",
  "00_nucleo/diagnosticos/p1212-vereditos.tsv",
  "00_nucleo/diagnosticos/p1216-operator-oraculos.tsv",
  "00_nucleo/diagnosticos/p1216-operator-resultados.tsv",
  "00_nucleo/diagnosticos/p1216-operator-descoberta.tsv",
  "00_nucleo/diagnosticos/p1216-operator-ataques.tsv",
  "00_nucleo/diagnosticos/typst-p1216-operator-diagnostics.md",
  "00_nucleo/diagnosticos/p1217-ordering-oraculos.tsv",
  "00_nucleo/diagnosticos/p1217-ordering-resultados.tsv",
  "00_nucleo/diagnosticos/p1217-ordering-ataques.tsv",
  "00_nucleo/diagnosticos/typst-p1217-ordering-comparables.md",
  "00_nucleo/diagnosticos/p1218-unary-oraculos.tsv",
  "00_nucleo/diagnosticos/p1218-unary-resultados.tsv",
  "00_nucleo/diagnosticos/p1218-unary-ataques.tsv",
  "00_nucleo/diagnosticos/p1218-binop-auditoria.tsv",
  "00_nucleo/diagnosticos/typst-p1218-unary-operators.md",
  "00_nucleo/diagnosticos/p1219-tekt-manifesto.tsv",
  "00_nucleo/diagnosticos/p1219-decimal-int-oraculos.tsv",
  "00_nucleo/diagnosticos/p1219-decimal-int-resultados.tsv",
  "00_nucleo/diagnosticos/p1219-decimal-int-ataques.tsv",
  "00_nucleo/diagnosticos/p1219-binop-readjudicacao.tsv",
  "00_nucleo/diagnosticos/p1219-tekt-certificado.tsv",
  "00_nucleo/diagnosticos/typst-p1219-decimal-int-arithmetic.md",
]
nota = "Fechamento declarado e limitado à semântica pública dos operadores da linguagem, não à igualdade mecânica Rust. P1219 fechou as oito operações Decimal↔Int, repetiu 22 casos focais, 58 controles P1216/P1217 e 16 unários P1218 duas vezes, e readjudicou 19/19 BinOp sem remaining_gap. Assign e assigns compostos pertencem ao evaluator de atribuição por desenho."

