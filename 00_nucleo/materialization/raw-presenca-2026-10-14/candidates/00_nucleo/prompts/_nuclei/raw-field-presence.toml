tekt = 1
kind = "nucleus"
id = "raw-field-presence"
title = "Presença lexical dos campos Raw"

[[claims]]
id = "known-and-omitted"
level = "must"
statement = "Raw conserva text e a presença independente de block e lang. block false explícito e lang none explícito não colapsam com omissão. text é sempre conhecido no modelo vigente."

[[claims]]
id = "no-render-inference"
level = "must-not"
statement = "Métodos de campos e encoders não inferem presença a partir de block false, lang None, estilo herdado ou render. Defaults continuam separados dos campos lexicalmente conhecidos."

[[claims]]
id = "transport"
level = "must"
statement = "Clone, Source, mapas de conteúdo e texto, observação conservadora e igualdade de linguagem preservam presença. Nenhum cache reutiliza um Raw com presença diferente como se os campos observáveis fossem os mesmos."

[[claims]]
id = "public-projection"
level = "must"
statement = "A projeção lexical usa ordem text, block, lang; block e lang só são publicados quando conhecidos. Snapshot presente permanece autoritativo. Presença não altera a fase de realização nem legitima novos defaults de render."
