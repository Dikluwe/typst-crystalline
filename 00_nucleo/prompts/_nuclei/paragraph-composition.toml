tekt = 1
kind = "nucleus"
id = "paragraph-composition"
title = "Paragraph boundaries and causal line closure"
[[claims]]
id = "physical-lines"
level = "must"
statement = "A line continued by new material uses par.justify for space justification; final line, parbreak and linebreak false keep natural width. linebreak true requests justification independently of paragraph."
[[claims]]
id = "paragraph-node"
level = "must"
statement = "Content.Par is a language block boundary even when empty; node construction/realization remains eval, geometry/composition remains layout."
[[claims]]
id = "lexical-close"
level = "must"
statement = "Line before styled paragraph closes before its options install; paragraph closes final line within its scope. Inline-style wrappers do not become extra paragraphs."
[[claims]]
id = "terminal-causality"
level = "must"
statement = "Terminal geometry uses causal baseline of last confirmed paragraph line; notes retain clearance budget. Private terminal-closure state participates in checkpoints/rollback. Empty paragraph retains explicit advance without fabricated ink."
[[claims]]
id = "selector-scope"
level = "must-not"
statement = "Space-based composition is presented as implementation of optimized selector, CJK interglyph justification or global paragraph preparation."
[[claims]]
id = "scope-origin"
level = "must"
statement = "Before first material content, #set scopes stay outside realized paragraphs so show par has precedence. Producer marks origin with private eval.flow.scope; inline fragments are not promoted through style fields. A wrapper covering all material of still-empty flow is factored as exterior scope, including constructors, preserving show-set precedence."