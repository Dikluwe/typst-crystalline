tekt = 1
kind = "nucleus"
id = "paragraph-bidi-origin"
title = "Original identity of bidi fragments"
[[claims]]
id = "exact-origin"
level = "must"
statement = "Text carriers receive BidiSpan only when text exactly matches a UTF-8 range of certified complete logical input. None is mandatory without proof; never infer identity from equal strings, style or position."
[[claims]]
id = "preservation"
level = "must"
statement = "Clones, translations, envelopes and rollback preserve origin. Exact splits preserve subspans. Merge retains one span only for contiguous ranges in the same input/segment; otherwise keep separate fragments."
[[claims]]
id = "auxiliary-isolation"
level = "must-not"
statement = "Virtual controls of auxiliary Unicode representation never enter Content, carrier text, glyphs or ToUnicode. Author controls cannot be erased as virtual controls."
[[claims]]
id = "local-lifetime"
level = "must"
statement = "Input/resolution remain compilation-local. Add no cross-edit retention, mutable globals, unsafe or TextStyle-key context. Unicode bidi remains L3."