tekt = 1
kind = "nucleus"
id = "entities-element-boundary"
title = "Fronteira fechada e extensível de Element"

[[claims]]
id = "closed-content"
level = "must"
statement = "Content permanece enum fechado e possui uma única variante Dynamic como porta para implementações externas de Element."

[[claims]]
id = "same-element-trait"
level = "must"
statement = "Elementos nativos e de utilizador implementam o mesmo trait Element; a ponte DynElement é derivada por blanket e não constitui uma segunda API manual."

[[claims]]
id = "static-native"
level = "must"
statement = "Elementos nativos conservam despacho estático; somente o conteúdo da variante Dynamic usa despacho object-safe."

[[claims]]
id = "element-behavior"
level = "must"
statement = "Cada Element define texto, vazio, transformação de filhos, leitura de campos e identidade de kind coerentes com sua própria morfologia."

[[claims]]
id = "injected-registry"
level = "must"
statement = "Descoberta de constructors dinâmicos é injetada e pura em L1, sem registro global mutável."
