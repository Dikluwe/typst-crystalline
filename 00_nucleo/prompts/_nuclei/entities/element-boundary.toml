tekt = 1
kind = "nucleus"
id = "entities-element-boundary"
title = "Closed and extensible Element boundary"
[[claims]]
id = "closed-content"
level = "must"
statement = "Content remains a closed enum with exactly one Dynamic variant as the entry for external Element implementations."
[[claims]]
id = "same-element-trait"
level = "must"
statement = "Native and user elements implement the same Element trait; DynElement is blanket-derived, not a second manual API."
[[claims]]
id = "static-native"
level = "must"
statement = "Native elements retain static dispatch; only Dynamic variant content uses object-safe dispatch."
[[claims]]
id = "element-behavior"
level = "must"
statement = "Each Element defines text, emptiness, child transformation, field reading and kind identity consistent with its morphology."
[[claims]]
id = "injected-registry"
level = "must"
statement = "Dynamic constructor discovery is injected and pure in L1, without mutable global registration."