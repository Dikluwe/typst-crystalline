tekt = 1
kind = "nucleus"
id = "table-cell-realization"
title = "Logical table resolution before cell recipe"
[[claims]]
id = "phase-order"
level = "must"
statement = "Table rule precedes surviving table's cell resolution;logical resolution precedes cell rule;resulting body realizes only afterward. Replacement never executes hidden-content recipes."
[[claims]]
id = "placement-owner"
level = "must"
statement = "The sole occupancy algorithm belongs to compiler/layout/grid_placement;Table policy follows document order and produces row-major plan,keeping legacy Grid policy separate through closed parameter."
[[claims]]
id = "known-fields"
level = "must"
statement = "Lexical fields/resolved plan are distinct;prepared-cell getters project known properties without mutating raw variable/constructor;explicit none overrides inheritance."
[[claims]]
id = "no-cell-location"
level = "must-not"
statement = "Preparation never makes table.cell locatable,assigns no false Location and changes no query/counter rejection."
[[claims]]
id = "geometry-boundary"
level = "must"
statement = "Fonts,measurement,physical tracks,pagination/ink belong to layout;logical plan/recipes to realization. Layout executes no Func/Engine;HTML consumes plan without paged layout."
[[claims]]
id = "once-and-scope"
level = "must"
statement = "Recipes use causal insertion environment,retain aliases/scope/context and effects once per accepted insertion. Physical repetition/valid-contribution replay never repeats recipes. Publish complete plans only."