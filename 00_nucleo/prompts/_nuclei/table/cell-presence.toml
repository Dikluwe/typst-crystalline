tekt = 1
kind = "nucleus"
id = "table-cell-presence"
title = "Lexical cell field presence"
[[claims]]
id = "presence"
level = "must"
statement = "Omitted,explicit auto and explicit value are preserved nominal states. Explicit fill/stroke none is known,not omitted."
[[claims]]
id = "preservation"
level = "must"
statement = "Clone,body/text transformation,temporal materialization and observation retain presence with values;never infer presence from render defaults."
[[claims]]
id = "bounded-phase"
level = "must-not"
statement = "This lexical contract resolves no positions,padding,inherited styles or implicitly generated cell recipes in a new phase."