tekt = 1
kind = "nucleus"
id = "table-cell-occurrence"
title = "Standalone defaults and nominal per-Cell rule consumption"
[[claims]]
id = "prepared-defaults"
level = "must"
statement = "Raw Cell retains omission;prepared standalone Cell knows intrinsic defaults without fictitious position/Table inheritance;no preparation makes Cell locatable."
[[claims]]
id = "rule-consumption"
level = "must"
statement = "Aliases of prepared Cell argument retain occurrence-consumed rules and permit earlier unconsumed rules;newly constructed Cell is fresh occurrence without inherited global revocation."
[[claims]]
id = "fresh-depth"
level = "must"
statement = "Equal morphology never ends fresh Cell generation;emitted products follow causal show-depth limit/origin error,while hidden products are unrealized. Other-element policies remain their owners' responsibility."
[[claims]]
id = "visual-once"
level = "must"
statement = "Only complete visual is published,traversed,indexed/rendered;lexical body remains language source,not a second emitted product."
[[claims]]
id = "language-versus-reuse"
level = "must"
statement = "Language equality observes known properties/body without guards,stage or derived visual;reuse proof retains complete causal state."