tekt = 1
kind = "nucleus"
id = "table-cell-style-defaults"
title = "Declared Cell defaults and effective properties"
[[claims]]
id = "source-and-effective"
level = "must"
statement = "Constructor/lexical presence remain intact;preparation retains private typed effective properties,getters/equality observe known fields,and reuse proof includes causal state."
[[claims]]
id = "precedence"
level = "must"
statement = "Explicit constructor(including auto/none) overrides declared defaults;stroke/alignment components fold with Table,not Cell style;absent fields use insertion style. Evaluate declarations once,publish only after validation."
[[claims]]
id = "placement-and-padding"
level = "must"
statement = "Resolve Cell defaults before Table occupancy/groups;padding receives explicit spans1 and other style properties. Positioned cell uses already resolved properties;later Cell show-set never redefines occupancy."
[[claims]]
id = "scope-and-identity"
level = "must"
statement = "Raw aliases receive defaults in insertion environment;prepared snapshots preserve properties/consumed rules,including Table insertion. Local scope/show-set never leaks or executes hidden content."