tekt = 1
kind = "nucleus"
id = "shapes-optional-stroke"
title = "Explicit absence of closed-shape stroke"
[[claims]]
id = "explicit-none"
level = "must"
statement = "In consuming constructors,stroke:none is explicit stroke absence,accepted with/without fill and never reenables stroke fallback."
[[claims]]
id = "omission"
level = "must"
statement = "Omitted stroke preserves existing fallback:absent fill never makes stroke:none equivalent to omission. Dimensions,fill and unrelated properties retain meaning."