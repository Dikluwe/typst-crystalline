tekt = 1
kind = "nucleus"
id = "expression-source-identity"
title = "Causal identity of expression and document sources"
[[claims]]
id = "distinct-origins"
level = "must"
statement = "In Source-based contextual eval, document, expression and distinct physical files have distinct FileIds in the same World. Diagnostics and traces preserve causal Source; names, equal texts and phase order cannot substitute for identity."
[[claims]]
id = "allocated-in-infra"
level = "must"
statement = "SystemWorld allocates and publishes transient Sources per instance using the same serialized physical-file counter. No published FileId is recycled or overwritten on exhaustion; L1 receives prepared Source, invents no IDs, queries no arbitrary IDs and retains no global interner."
[[claims]]
id = "source-is-not-io-base"
level = "must"
statement = "Expression Source identifies syntax/diagnostics; initial read/import base remains world.main(). Callbacks/imports retain their own lexical origins/bases. Stdin document has registered Source and base at supplied root."
[[claims]]
id = "transient-not-file"
level = "must-not"
statement = "Transient Sources do not enter the canonical physical-file map or dependencies(), trigger no marker-path reads and never collide with actual files named <input-expression> or <stdin>. Transient Source and bytes remain resolvable for the World lifetime."
[[claims]]
id = "single-context-compilation"
level = "must"
statement = "The Source-based contextual facade uses existing compilation and its final introspector without second program execution, diagnostic inference or index reconstruction to repair origins. Features, limits, scopes, phases, warning order and serialization retain existing contracts."