tekt = 1
kind = "nucleus"
id = "parse-core"
title = "Shared parser cursor, spans and modes"
[[claims]]
id = "cursor-progress"
level = "must"
statement = "Each production accepts, converts or diagnoses tokens to advance cursor or explicitly reach its stop-set."
[[claims]]
id = "lossless-span"
level = "must"
statement = "Leaves, trivia, wrapped nodes and errors preserve token-stream text coverage/source offsets."
[[claims]]
id = "contiguous-marker"
level = "must"
statement = "Markers delimit contiguous node sequences; wrapping excludes unconsumed lookahead."
[[claims]]
id = "scoped-mode"
level = "must"
statement = "SyntaxMode/AtNewline transitions are construct-scoped and restore previous state on completion."
[[claims]]
id = "owner-grammar"
level = "must"
statement = "Specific productions, precedence, recovery and diagnostics belong to each grammar's owning prompt."