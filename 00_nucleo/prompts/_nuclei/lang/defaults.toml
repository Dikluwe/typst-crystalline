tekt = 1
kind = "nucleus"
id = "lang-defaults"
title = "Deterministic localized text defaults"
[[claims]]
id = "exact-lang"
level = "must"
statement = "Localization selects entries by exact Lang-code equality without inferring region, alias or process locale."
[[claims]]
id = "deterministic-fallback"
level = "must"
statement = "Absent or unsupported code uses the owner-defined deterministic fallback, never runtime environment."
[[claims]]
id = "english-language-default"
level = "must"
statement = "When a helper generates language text without covered localization, its default represents the ratified English form."
[[claims]]
id = "owner-tables"
level = "must"
statement = "Specific texts, glyphs, spaces and fallback rules remain in each generator's owning prompt."