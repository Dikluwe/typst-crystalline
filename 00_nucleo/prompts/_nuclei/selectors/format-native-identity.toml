tekt = 1
kind = "nucleus"
id = "format-native-element-identity"
title = "Internal identity of native formats"
[[claims]]
id = "typed-witness"
level = "must"
statement = "svg/png/pdf/html/bundle retain a private nominal witness transported by actual Func and clones. Shared callback,name,namespace and Rust equality do not authenticate it; reconstructing ordinary Native from same pointer does not copy witness."
[[claims]]
id = "native-projections"
level = "must"
statement = "Format Func preserves NativeFunc fields,static four-argument ABI,native_fn_addr pointer,name,namespace,diagnostic span,repr,clone,dispatch. Eq/Hash retain prior compatibility with same-name Native; this grants no element capability to ordinary Native. With retains namespace/name but is not bare element. No metadata call executes callback."
[[claims]]
id = "closed-construction"
level = "must-not"
statement = "Format identification adds no binding,changes no gate/default,manually constructs no format,duplicates no factory and creates no call wrapper. Existing factories attach internal identity to original NativeFunc,preserving actual namespaces/members/phases."
[[claims]]
id = "observation-witness"
level = "must"
statement = "Observation relation of two format Func compares nominal witness,callback,name,namespace without execution. Format and ordinary Native are observationally different even when public name-based Eq remains true,because only Format carries selection capability."