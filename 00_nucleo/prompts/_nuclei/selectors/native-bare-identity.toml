tekt = 1
kind = "nucleus"
id = "native-bare-selector-identity"
title = "Native element identity without a where group"
[[claims]]
id = "absent-group"
level = "must"
statement = "A bare native selector preserves absent where group;it is not explicitly empty Element filter with empty fields."
[[claims]]
id = "typed-identity"
level = "must"
statement = "Bare native selector recognition/identity comparison uses actual native,never alias-name discrimination or constructor execution."
[[claims]]
id = "locatability"
level = "must"
statement = "Selector construction does not require locatability;queries/counters validate each leaf and never promote table.cell into index."