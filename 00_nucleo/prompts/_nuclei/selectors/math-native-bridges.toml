tekt = 1
kind = "nucleus"
id = "math-native-metadata-bridges"
title = "Internal mathematical element identity bridges"
[[claims]]
id = "original-callback"
level = "must"
statement = "Math metadata bridges reexport original callback directly,preserving ABI;they execute no constructor,create no wrapper and choose no identity from Func name or produced-content type."
[[claims]]
id = "internal-visibility"
level = "must"
statement = "New metadata bridges stay restricted to crate::compiler. Internal scripts/limits access creates no external Rust API or change to existing public reexports."
[[claims]]
id = "registration-preservation"
level = "must-not"
statement = "Transporting callbacks into metadata table adds no binding,changes no math runtime catalog,moves no casts/construction into hubs and changes no pipeline phase."