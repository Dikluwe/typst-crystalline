tekt = 1
kind = "nucleus"
id = "fonts-fallback-selection"
title = "Consistent typographic fallback chain selection"
[[claims]]
id = "declared-order"
level = "must"
statement = "Try families in each cataloged chain in declared order before global coverage/similarity fallback."
[[claims]]
id = "measurement-render-alignment"
level = "must"
statement = "Measurement and shaping consult the same chains so measured and drawn faces can coincide."
[[claims]]
id = "semantic-math-trigger"
level = "must"
statement = "Activate the mathematical chain through explicit math mode or a primary face with MATH table, never textual occurrence of math in the family name."
[[claims]]
id = "no-catalog-global-scan"
level = "must-not"
statement = "A cataloged-chain lookup is replaced by a global scan ordered by local font discovery."