tekt = 1
kind = "nucleus"
id = "bidi-visual-identity"
title = "Bidi controls and visual glyph identity"
[[claims]]
id = "explicit-bidi-set"
level = "must"
statement = "The bidi control set for this correction is U+061C, U+200E, U+200F, U+202A–U+202E and U+2066–U+2069; do not generalize to ZWJ, ZWNJ, variation selectors or other invisible characters."
[[claims]]
id = "logical-input"
level = "must"
statement = "Preserve complete author text and bidi resolution; remove placeholders after shaping and bidi controls only from the shared visible glyph's global text identity."
[[claims]]
id = "causal-glyph-identity"
level = "must-not"
statement = "Do not decide identity by zero advance, GID, position, appearance or font name; spaces, letters, clusters and supplementary Unicode retain their identity."