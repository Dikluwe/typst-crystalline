tekt = 1
kind = "nucleus"
id = "shaped-face-identity"
title = "Effective font of the shaped carrier"
[[claims]]
id = "source-face"
level = "must"
statement = "TextShaped.font Some preserves the loaded font that produced glyphs and units_per_em, never substituting family, variant, GID or World slot identity. None preserves the legacy path."
[[claims]]
id = "transport"
level = "must"
statement = "Clone and geometric transformation preserve the font. Shaped merge requires compatible face and axes. Do not erase style semantics to induce later selection."
[[claims]]
id = "resource-binding"
level = "must"
statement = "Certified TextShaped binds glyphs, subset/CMap and drawing resource to the same original face/effective coordinates. Explicitly associate origin and instanced bytes; never apply GIDs to another face by name or numeric range. Direct mathematical Glyph retains its own contract."
[[claims]]
id = "session-boundary"
level = "must-not"
statement = "This correction creates no unsafe, mutable global state, retained World pointer or L1 font I/O. Resource preparation/cache lasts one export."