tekt = 1
kind = "nucleus"
id = "ssty-math-size"
title = "Nominal ssty-level projection"
[[claims]]
id = "levels"
level = "must"
statement = "For eligible math-mode input outside TextItem, MathSize::Script requests ssty 1, ScriptScript 2, and Display/Text no ssty level (None)."
[[claims]]
id = "gates"
level = "must"
statement = "Outside math, in math_text_item or without eligibility, preserve None before size selection. Shaping uses canonical ssty_eligible_text; the metrics owner receives already decided eligibility."
[[claims]]
id = "nominal-complement"
level = "must"
statement = "The MathSize match explicitly names Display, Text, Script and ScriptScript, with no wildcard. Display and Text may share None (uniform V19); both require controls. A future variant requires explicit compiler review."
[[claims]]
id = "boundary"
level = "must-not"
statement = "This repair changes no MathSize, TextStyle, API, default, phase, eligibility, fallback, OpenType script, GSUB, feature, cache or font selection. Create no parallel predicate or V16/V19 suppression."