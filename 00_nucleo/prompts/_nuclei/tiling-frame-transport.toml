tekt = 1
kind = "nucleus"
id = "tiling-frame-transport"
title = "Resolved cell and paint coordinate frame"
[[claims]]
id = "resolved-cell"
level = "must"
statement = "Frame paint transports only layout-prepared cell with valid finite size,pitch/placement. Layout executes body once per paint occurrence;repetition neither clones cell proportionally to covered area nor reevaluates content."
[[claims]]
id = "reference-space"
level = "must"
statement = "Parent uses owning container's paint frame. Page/cell are roots;Box/Block establish inset-inclusive local roots;Place/ordinary transforms inherit. Complete affine composition/inverse distinguishes self/parent;offset is rotation pivot,periodicity in rotated basis."
[[claims]]
id = "roles-and-resources"
level = "must"
statement = "Fill/stroke retain same prepared paint with paths,fill rule,thickness,caps,joins,dash/miter. Cell fonts,images,colors/nested patterns join target resources;repetition does not multiply cell text content/page annotations."
[[claims]]
id = "no-false-success"
level = "must-not"
statement = "Unresolved cell or repetition limit cannot silently become solid color or production success. Exporter executes no layout. No declarative language datum is rewritten with frame/target dependency."