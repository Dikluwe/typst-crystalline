tekt = 1
kind = "nucleus"
id = "place-flow-boundary"
title = "Causal physical boundary for out-of-flow Place"
[[claims]]
id = "causal-end"
level = "must"
statement = "Place without explicit vertical alignment uses pending-line baseline or last certified physical flow boundary. Boundary excludes next-baseline preparation/weak margins and is not maximum bbox because overlays consume no flow. Explicit Top/Bottom/Horizon retains region."
[[claims]]
id = "witness"
level = "must"
statement = "Private certificate stores physical end/prepared cursor at production time. Reuse only while cursor still corresponds to current state;unknown change invalidates evidence,no guessed end. Parbreak may retain end while preparing margin;VSpace adds physical advance."
[[claims]]
id = "isolation"
level = "must"
statement = "Subframe starts without certificate/restores parent in LIFO;checkpoint captures/restores;new page/column/configuration clears. Place never changes parent boundary. No public contract/pipeline/producer-margin-policy changes."