tekt = 1
kind = "nucleus"
id = "transform-semantics"
title = "Transform identity,presence and resolution"
[[claims]]
id = "operation-and-presence"
level = "must"
statement = "Move,Rotate,Scale,Skew retain native identity/lexical argument presence. Omission,zero,false,auto/partial alignment never collapse. Matrix is a distinct generic Rust operation,never inferred native from coefficients."
[[claims]]
id = "late-resolution"
level = "must"
statement = "Eval validates/transports typed values without baking style defaults or resolving font/region/body-dependent Length. Layout resolves at use,produces finite matrix/preserves paint root;exporters consume Frame without repeated layout."
[[claims]]
id = "public-observation"
level = "must"
statement = "Fields,func,repr,encoders,selectors,language equality/conservative observation retain operation,values/presence. Clone,maps,wrappers,caches/realization never erase distinction. Inherited set fields do not become lexically explicit."
[[claims]]
id = "frame-geometry"
level = "must"
statement = "Origin resolves each axis against logical body frame with center/horizon defaults and directional alignment resolved in current style. Reflow false retains logical size/baseline/advance;true transforms bounds/adjusts advance-baseline per operation. Move changes ink without logical-frame change."
[[claims]]
id = "no-surrogate-transport"
level = "must-not"
statement = "Do not encode author arguments in sentinel coefficients,artificial Styled,metadata,strings,global registry,false Location/redundant matrix. Never infer kind from matrix or apply pivot/origin twice."
[[claims]]
id = "target-boundary"
level = "must"
statement = "Transforms never promote HTML to paged layout. Existing strict unsupported-content diagnostic remains;do not copy observed pinned-HTML body deletion. html.frame islands retain their own contract."