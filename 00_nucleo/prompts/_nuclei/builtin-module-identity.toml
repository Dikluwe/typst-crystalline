tekt = 1
kind = "nucleus"
id = "builtin-module-identity"
title = "Internal identity of std and format modules"
[[claims]]
id = "trusted-origin"
level = "must"
statement = "Native composition assigns internal Std or Format identity; Module::new creates an ordinary module for any name and bindings. No local name, similar scope or user content authenticates a native module."
[[claims]]
id = "alias-lifetime"
level = "must"
statement = "Identity follows cloned Module through aliases, closures, imports and reexports, independently of later std name lookup; existing Arc equality, debug, names and public API remain."
[[claims]]
id = "feature-boundary"
level = "must"
statement = "In AST access, std.html and format.html require Html, std.asset and format.bundle require Bundle, including aliases. Ordinary homonymous modules and dictionaries receive no such gates. Diagnostic precedes lookup and arguments, uses field span and preserves existing message and hints. Target does not enable a feature."
[[claims]]
id = "private-mechanics"
level = "must-not"
statement = "The internal mark changes public signatures/fields, Module equality, mutability, function wrappers, phases, defaults or other namespace policies."