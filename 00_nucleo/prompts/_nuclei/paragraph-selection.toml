tekt = 1
kind = "nucleus"
id = "paragraph-selection"
title = "Preparação, seleção e emissão de parágrafos certificados"

[[claims]]
id = "strategy-transport"
level = "must"
statement = "linebreaks validado conserva Auto ou simple/optimized no canal privado par.linebreaks; auto usa optimized quando justify é verdadeiro e simple nos demais casos."

[[claims]]
id = "prepared-input"
level = "must"
statement = "Os dois seletores consomem a mesma preparação pura e completa: palavras, fragmentos de estilo e separadores causais medidos por métricas injetadas. Não emitem frames, alteram regiões ou reexecutam eval."

[[claims]]
id = "scope"
level = "must"
statement = "A seleção global certifica texto latino LTR de largura constante fora de colunas, células e floats. Tracking uniforme em conteúdo textual sem mudança de escopo pode ser admitido somente quando seus intervalos entre unidades são medidos e emitidos uma vez e as larguras efetivas permanecem finitas e não negativas; tracking misto permanece no percurso incremental; a combinação com hifenização uniforme só é certificada quando o tracking resolvido é zero; valores não nulos requerem informação de shaping do corte e conservam fallback. Hifenização lexical pode integrar candidatos da preparação quando a palavra possui estilo e política uniformes. Matemática, smallcaps e conteúdo recusado conservam o percurso incremental; isto nunca prova optimized completo."

[[claims]]
id = "materialization"
level = "must"
statement = "A emissão conserva texto, estilos e origens dos separadores, aplica seu avanço uma vez, admite baselines e fecha apenas linhas materialmente continuadas; a última linha permanece natural salvo redução necessária dos espaços."

[[claims]]
id = "hyphen-candidates"
level = "must"
statement = "A preparação resolve hyphenate lexicalmente (Bool explícito ou auto pela justificação) antes de gerar candidatos, conserva offsets UTF-8 seguros e mede ranges partidos com métricas injetadas. Simple e optimized usam esses mesmos candidatos; o custo global inclui penalidade de hifenização e de linhas consecutivas com hífen."

[[claims]]
id = "hyphen-optical-overhang"
level = "must"
statement = "O custo do candidato inclui a largura natural do hífen; somente a emissão de linha selecionada que termina em hífen compensa 55% do avanço do glyph na margem, conforme o overhang default medido, mas somente quando a política lexical overhang do fragmento final está ativa; false desativa a compensação. A compensação não é espaço textual nem altera texto, fronteira ou candidato."
