tekt = 1
kind = "nucleus"
id = "paragraph-selection"
title = "Preparation, selection and emission of certified paragraphs"
[[claims]]
id = "strategy-transport"
level = "must"
statement = "Validated linebreaks preserves Auto or simple/optimized in private par.linebreaks; auto uses optimized for justify=true, simple otherwise."
[[claims]]
id = "prepared-input"
level = "must"
statement = "Both selectors consume same pure complete preparation: words, style fragments and causal separators measured through injected metrics. They emit no frames, change no regions and rerun no eval."
[[claims]]
id = "scope"
level = "must"
statement = "Global selection certifies Latin text under finite constant-region width outside columns/cells/floats; line shape may distinguish initial/continued widths for hanging-indent. Latin RTL may join only without active BidiCursor or tracking, preserving None absent logical-identity proof; other bidi retains existing path. Uniform tracking without text-scope change is admitted only when interunit intervals are measured/emitted once and effective widths remain finite/nonnegative; mixed tracking remains incremental; uniform hyphenation combination is certified only with resolved tracking zero, nonzero needs cut-shaping information and keeps fallback. Lexical hyphenation may enter prepared candidates for uniform word style/policy. Math, smallcaps and refused content remain incremental; this never proves complete optimized support."
[[claims]]
id = "materialization"
level = "must"
statement = "Emission preserves text, styles and separator origins, applies advance once, admits baselines and closes only materially continued lines; final line remains natural except necessary space reduction."
[[claims]]
id = "hyphen-candidates"
level = "must"
statement = "Preparation resolves hyphenate lexically(explicit Bool or auto from justification) before candidates, preserves safe UTF-8 offsets and measures split ranges with injected metrics. Simple/optimized use identical candidates; global cost includes hyphenation/consecutive-hyphen penalties."
[[claims]]
id = "hyphen-optical-overhang"
level = "must"
statement = "Candidate cost includes natural hyphen width; only selected hyphen-ending line emission compensates55% glyph advance at margin under measured default overhang, and only if final fragment's lexical overhang is active; false disables. Compensation is neither textual space nor change to text/boundary/candidate."