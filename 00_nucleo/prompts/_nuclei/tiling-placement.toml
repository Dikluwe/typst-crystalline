tekt = 1
kind = "nucleus"
id = "tiling-placement"
title = "Offset as tiling rotation origin"
[[claims]]
id = "rotation-about-offset"
level = "must"
statement = "In chosen pattern frame,offset is clockwise grid-rotation origin:local q maps to offset + R(angle) q. Offset percentages resolve against cell size+spacing. Entity/constructor retain these values without prerotating offset;materialization never rotates offset point around zero."
[[claims]]
id = "periodic-equivalence"
level = "must"
statement = "Removing whole translation periods preserves paint only in grid frame:equivalent offsets differ by R(angle) applied to integer pitch multiples. Modular reduction occurs in inverse-rotation basis,not independently on page axes at nonzero angle."