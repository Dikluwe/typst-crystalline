tekt = 1
kind = "nucleus"
id = "paragraph-hanging-validation"
title = "Lexical type of par.hanging-indent"
[[claims]]
id = "length-only"
level = "must"
statement = "hanging-indent in set par/constructor par accepts Length only, including zero, negatives and abs+em. None, Auto, unitless integers, floats, Ratio and strings are type errors, not ignored properties."
[[claims]]
id = "causal-diagnostic"
level = "must"
statement = "Type failure uses existing expected length diagnostic with public type and argument-value span; unitless integer retains add-pt hint. Evaluate each argument once, changing no other arguments/body/environment on rejection."