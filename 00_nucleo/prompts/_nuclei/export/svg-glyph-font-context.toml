tekt = 1
kind = "nucleus"
id = "svg-glyph-font-context"
title = "Font identity for SVG mathematical glyphs"
[[claims]]
id = "resolved-font-identity"
level = "must"
statement = "Each FrameItem::Glyph promoted in SVG uses the same font identity resolved by pipeline for base_char and style; glyph_id is never interpreted outside that font."
[[claims]]
id = "immutable-l3-context"
level = "must"
statement = "Resolution travels as immutable L3 context; it does not change FrameItem, rerun layout or access filesystem in the exporter."
[[claims]]
id = "stable-request-key"
level = "must"
statement = "Association uses a normalized key of resolution-relevant properties pointing to complete FontKey, never positional index, address, traversal order or incidental occurrence."
[[claims]]
id = "observable-glyph"
level = "must"
statement = "SVG preserves observable outline, position, scale and fill; defs ids, order and XML spelling are mechanics."
[[claims]]
id = "ambiguous-is-unknown"
level = "must-not"
statement = "Missing or ambiguous font is promoted to a preserved glyph by trying glyph_id in incidental fonts."
[[claims]]
id = "fontless-wrapper-scope-out"
level = "must"
statement = "Fontless SVG wrappers retain explicit scope exclusions and fabricate neither textual fallback nor outline."