tekt = 1
kind = "nucleus"
id = "format-option-precedence"
title = "Precedence of explicit and document options"
[[claims]]
id = "explicit-overrides-document"
level = "must"
statement = "When a format exposes a corresponding document option, explicit caller export option Some(T) must override it."
[[claims]]
id = "absence-defers-to-document"
level = "must"
statement = "When a format exposes a corresponding document option, preserve absent explicit option None until that document option can be consulted, without inventing a T value."
[[claims]]
id = "default-after-document"
level = "must"
statement = "When a corresponding document option exists, apply the format default only if neither caller nor document supplies a value; each owning prompt defines its own default and unit transformations."
[[claims]]
id = "no-early-collapse"
level = "must-not"
statement = "Along a document-supported corresponding option path, a layer before that meeting must not collapse absence into false, zero or another final default."