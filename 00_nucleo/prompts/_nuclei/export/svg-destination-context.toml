tekt = 1
kind = "nucleus"
id = "svg-destination-context"
title = "Internal destination context for paged SVG"
[[claims]]
id = "same-page-registry"
level = "must"
statement = "A page SVG context derives labels and positions from PagedDocument and includes only destinations on the exported page."
[[claims]]
id = "closed-edge"
level = "must"
statement = "A LinkTarget::Destination edge is emitted as an internal link only when the same context contains a matching resolved destination node."
[[claims]]
id = "single-identity"
level = "must"
statement = "Edge and node use the same deterministic local identity; concrete id spelling is not a language observable."
[[claims]]
id = "no-dangling-cross-page"
level = "must-not"
statement = "A missing, cross-page destination or one without explicit external routing is emitted as a dangling href fragment or falsely preserved link."
[[claims]]
id = "routing-authority"
level = "must"
statement = "Filename, bundle and cross-page routing policy belongs to the composition caller and is not invented by a single-page SVG exporter."