tekt = 1
kind = "nucleus"
id = "export-bitmap-embedding"
title = "Bitmap glyph identity in PDF export"
[[claims]]
id = "glyph-identity"
level = "must"
statement = "Bitmap glyph identity combines font instance and original glyph id; repeats reuse one raster resource."
[[claims]]
id = "placement-metadata"
level = "must"
statement = "Shared payload preserves dimensions, bearings and pixels-per-em needed for baseline positioning."
[[claims]]
id = "unsupported-fallback"
level = "must"
statement = "A glyph without supported raster remains absent from the bitmap map and follows the normal font path."
[[claims]]
id = "no-cross-font-alias"
level = "must-not"
statement = "Equal glyph ids from distinct font instances are treated as the same resource identity."