tekt = 1
kind = "nucleus"
id = "pdf-conic-mesh"
title = "Domínio e codificação da malha cônica PDF"

[[claims]]
id = "encoding"
level = "must"
statement = "A malha Type 6 usa flag de 8 bits, doze pontos de coordenadas de 16 bits big-endian e quatro cores de componentes de 8 bits. Decode e payload provêm do mesmo domínio calculado; o dicionário não presume [0,1] para coordenadas."

[[claims]]
id = "coverage"
level = "must"
statement = "A extensão da malha cônica deve cobrir a área potencialmente pintada na página, inclusive stroke e caminhos fora da caixa nominal, sem limitar a cobertura a um círculo inscrito. O coletor transporta tamanho físico da referência e limites do canvas no espaço do padrão; o emissor de malha determina centro, raio e Decode."

[[claims]]
id = "orientation"
level = "must"
statement = "O centro autoral é relativo à referência; no espaço unitário Y-up do Pattern, cy=1-center.y. O início está à esquerda para angle=0 e o percurso das cores e a rotação positiva são horários. A direção é medida no espaço físico da referência antes da transformação de grupos, sem deformar ângulos pela razão largura/altura."
