tekt = 1
kind = "nucleus"
id = "pdf-conic-mesh"
title = "PDF conic mesh domain and encoding"
[[claims]]
id = "encoding"
level = "must"
statement = "Type6 mesh uses8-bit flag, twelve16-bit big-endian coordinate points and four8-bit component colors. Decode/payload derive from same computed domain; dictionary never assumes[0,1] coordinates."
[[claims]]
id = "coverage"
level = "must"
statement = "Conic mesh extent covers potentially painted page area including stroke/paths outside nominal box, not limited to inscribed circle. Collector transports physical reference size/canvas bounds in pattern space; mesh emitter determines center/radius/Decode."
[[claims]]
id = "orientation"
level = "must"
statement = "Author center is reference-relative; in Pattern unit Y-up space cy=1-center.y. Start is left for angle=0; color progression/positive rotation clockwise. Direction is measured in physical reference space before group transforms without width/height aspect deforming angles."