tekt = 1
kind = "nucleus"
id = "paragraph-hanging-indent"
title = "Hanging indent and causal first-line origin"
[[claims]]
id = "length-and-shape"
level = "must"
statement = "hanging-indent preserves lexical Length including zero, negative and abs+em. Resolve against shared paragraph size, not first/last run. First line retains normal origin; continuations indent on the direction's start edge and reduce width by the same length. A new region continues the same paragraph."
[[claims]]
id = "causal-boundary"
level = "must"
statement = "Declaration presence interrupts paragraph before/after scope, including zero, repeated equal value and empty body. Private occurrence transport may differ across StyleChain frames so diff_styles does not erase equal declarations. That value is neither a public option nor a substitute for length; never reevaluate arguments/callbacks."
[[claims]]
id = "paragraph-vs-fragment"
level = "must"
statement = "Inline container fragments do not apply generic hanging-indent. Explicit Par, Parbreak or flow structure requiring paragraphs activates paragraph context. Headings and simple raw/list/quote bodies do not inherit generic indent. Subframes isolate context; checkpoints/rollback preserve it."
[[claims]]
id = "one-horizontal-authority"
level = "must"
statement = "Simple/optimized selection, hyphenation, emission, incremental wrap, justification and alignment consult one line shape. Apply to cursor once per line without changing global width or line_start_x to simulate indentation. Reopen horizontal admission after region changes without resetting line counter."
[[claims]]
id = "bibliography-default"
level = "must"
statement = "Only Hanging plan applies bibliography's 1.5em default. Ambient set par does not replace it; an actually matched show-set may override with Length including zero. Columns/Plain retain their own geometry without accidental generic indent."
[[claims]]
id = "bibliography-first-line"
level = "must"
statement = "A Hanging entry uses initial inset h and private first-line compensation -h, retaining structured bodies/continuation. Capture compensation at first material unit, preserve initial shape in precommit advance and rollback. Fabricate no text, Location, occurrence tags or HSpace forcing greedy fallback."
[[claims]]
id = "progress-and-identity"
level = "must"
statement = "Extreme values preserve progress and all logical text even when ink leaves page and PDF extraction clips tokens. Never clamp indent to page interval, erase words or certify copy from clipped pdftotext. BidiSpan remains exact or None under origin nucleus, never infer identity from equal strings."
[[claims]]
id = "limits"
level = "must-not"
statement = "This change does not certify mixed metrics, all Unicode/RTL/object selection, incomplete public Par reflection, multiple bibliographies, adjacent clusters or still-unapproved R3-T1 realization. Do not change public APIs, realization order, flags or external defaults to bypass these pending items."