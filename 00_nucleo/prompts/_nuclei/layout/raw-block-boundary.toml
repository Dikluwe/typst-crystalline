tekt = 1
kind = "nucleus"
id = "raw-block-boundary"
title = "Physical boundary of block Raw"
[[claims]]
id = "boundary-once"
level = "must"
statement = "Block Raw and its show replacement preserve physical boundary once without executing recipe in layout. Private Styles markers transport block, size overrides as Length and existing margins; coordinates remain in render."
[[claims]]
id = "local-and-pending"
level = "must"
statement = "Block begins at region horizontal origin, uses margins collapsed with previous baseline and retains pending below for next unit. Final margin does not enlarge terminal block height. Measurement/emission use the same boundary."
[[claims]]
id = "font-and-overrides"
level = "must"
statement = "Raw default margins use effective Raw size and are weak like par.spacing. Neighboring paragraph contributes its margin; consecutive blocks collapse own margins by maximum. Explicit block.above/below/spacing overrides beat weak paragraph margin. Cursor collapses weak margin with following text margin while preserving explicit margins. Fonts/tokens remain with current owners."