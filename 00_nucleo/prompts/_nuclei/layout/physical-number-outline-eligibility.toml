tekt = 1
kind = "nucleus"
id = "physical-number-outline-eligibility"
title = "Approved physical eligibility for plain page numbers and heading Outlines"
[[claims]]
id = "reached-eligibility"
level = "must"
statement = "Paginated preparation selects the existing physical candidate protocol for a reached source-owned heading Outline or a reached SetPage/PageRun Numbering::Pattern, alongside existing rich-marginal and Repeat eligibility. Realized follows visual; PageRun follows its ordinary body and own declaration. Hidden originals and opaque functions are not executed or inspected as reached body work; operational templates remain dormant."
[[claims]]
id = "one-protocol"
level = "must"
statement = "Initial and accepted contextual contributions latch the same existing per-compilation Session, retained arena, Outline first/focal transactions, source plan/trace/store/index, discovery and sealed replay. Keep five contextual/page attempts, independent eight callback attempts, original source once, current authority, strict coverage and observation proof, diagnostic retirement and error precedence. No alternate solver, API, source replay or frame-derived semantic reconstruction is introduced."
[[claims]]
id = "targets-and-completion"
level = "must"
statement = "Bundle uses actual ordered document targets and one global semantic candidate; only paginated members select physical work. HTML remains behind its existing target barrier. Paged coordination consumes the already complete validated document and does not run another Outline or source evaluation over it."
[[claims]]
id = "acceptance"
level = "must"
statement = "Require actual language RED to GREEN for terminal page styles and Outline with Ref, keeping source words/pages, 0.001pt positions and independent PDF/SVG paint, original source identity and effects, dormant/hidden/None/Content controls, all technical and historic/JPEG resource gates. Eligibility itself proves neither completeness nor parity of other debts."
