tekt = 1
kind = "nucleus"
id = "typc-atom-display"
title = "Presentation of Auto and Bool language atoms"
[[claims]]
id = "display-morphology"
level = "must"
statement = "Interpolated Auto/Bool retain inline Raw lang typc representation, not ordinary Text. Presentation changes no raw value/getter."
[[claims]]
id = "constant-style"
level = "must"
statement = "typc auto, true and false atoms use constant.language classification and Typst Light #d73948 under existing Raw defaults."
[[claims]]
id = "html-atom-boundary"
level = "must"
statement = "HTML serializes only inline Raw typc auto/true/false subset with code data-lang typc and constant-color span, preserving escaping/mode. Other Raw remains outside this slice; HTML calls no paged layout."