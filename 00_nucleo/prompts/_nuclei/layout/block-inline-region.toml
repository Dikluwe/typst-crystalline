tekt = 1
kind = "nucleus"
id = "block-inline-region"
title = "block-inline-region"
[[claims]]
id = "causal-context"
level = "must"
statement = "While a Block body is active retain its horizontal origin relative to outer-region start and resolved inner width. After ordinary page/column transition reinstall these bounds in the new region. On exit restore outer context; same region uses existing restoration, new region its current outer geometry. Checkpoints capture/restore; subframes isolate/restore. Fields are Layouter-private, not BlockElem; never restore height/origin from a finished page."