tekt = 1
kind = "nucleus"
id = "position-frame-carriers"
title = "Captured positions follow visual composition"
[[claims]]
id = "capture-once-project-before-sealing"
level = "must"
statement = "Capture identity/order is determined during existing layout, without rerunning content or allocating Location during projection. Private carriers transport points through the frames' same coordinates/transforms; projection updates only existing substores before sealing and removes all carriers from public output."
[[claims]]
id = "no-material-no-new-observation"
level = "must"
statement = "Direct positional carriers are neutral to ink, dimensions, baseline, spacing and empty-line status. A visual copy creates no new observation; last logical capture prevails with first geometric occurrence of each capture. Checkpoints preserve registry and frames coherently."