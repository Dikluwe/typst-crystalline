tekt = 1
kind = "nucleus"
id = "block-auto-alignment"
title = "Geometric alignment in final Auto Block width"
[[claims]]
id = "constraint-versus-allocation"
level = "must"
statement = "Available width constrains body layout but is not Auto Block's final horizontal allocation. Geometric Align in Auto Block retains intrinsic position and defers horizontal displacement until final causal width including inset is known. Never execute body twice."
[[claims]]
id = "scope"
level = "must"
statement = "Private Auto-width state belongs to current Block. Isolated subframes do not inherit it; child Block replaces/restores in LIFO; checkpoints retain and page setup clears it. Resolve local fixups once before clipping/paint root in the same region."
[[claims]]
id = "limits"
level = "must"
statement = "This slice does not certify text-line alignment, centered math, horizontal Place, external decoration consumed before closure or fragmented Block. Geometric correction cannot declare these refuters resolved; each needs its own causal transport/validation."