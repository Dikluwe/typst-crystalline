tekt = 1
kind = "nucleus"
id = "cell-bidi-scope"
title = "Lexical bidi capability of an isolated cell"
[[claims]]
id = "bounded-cell"
level = "must"
statement = "Cell bidi certification requires a private capability installed by the emission owner for a single column/finite region; whole traversal still rejects previously excluded opaque content, transforms and environments. Do not generalize to multicolumn rows."
[[claims]]
id = "lexical-lifetime"
level = "must"
statement = "Capability starts false, restores on cell emission exit and suspends in nested subframes; it never escapes as public field, global, cross-document cache or phase change."