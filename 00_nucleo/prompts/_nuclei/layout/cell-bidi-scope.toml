tekt = 1
kind = "nucleus"
id = "cell-bidi-scope"
title = "Capacidade lexical bidi da célula isolada"

[[claims]]
id = "bounded-cell"
level = "must"
statement = "Certificação bidi de célula exige capacidade privada instalada pelo owner da emissão para uma coluna única e região finita; a travessia integral continua recusando conteúdo opaco, transformações e ambientes antes excluídos. Não generalizar a linhas de várias colunas."

[[claims]]
id = "lexical-lifetime"
level = "must"
statement = "A capacidade é false inicialmente, restaurada ao sair da emissão da célula e suspensa em subframes aninhados; não escapa como campo público, global, cache entre documentos ou mudança de fase."
