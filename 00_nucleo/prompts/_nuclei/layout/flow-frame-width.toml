tekt = 1
kind = "nucleus"
id = "flow-frame-width"
title = "Causal horizontal extent of automatic frames"
[[claims]]
id = "causal-width"
level = "must"
statement = "Flow intrinsic width is accumulated by layout producers in their frame before visual alignment displacement. Shapes use resolved size, images target size, lines actually emitted intrinsic extent, containers final allocation. It is not all-descendant ink bbox: Place/overlays do not enlarge flow."
[[claims]]
id = "scope"
level = "must"
statement = "Block isolates body extent and publishes complete inset-inclusive width once to parent. Subframes isolate/restore in LIFO and return a private width witness separate from legacy last_sub_frame_width. Checkpoints retain both states. Never measure or execute body again to obtain width."
[[claims]]
id = "pending"
level = "must"
statement = "Final automatic width must guide backing, clip and paint root in the same region. Fragmentation, late realignment and exporter affine frames require their own validation; installing a width witness does not certify those consumers."