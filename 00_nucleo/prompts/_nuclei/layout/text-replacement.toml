tekt = 1
kind = "nucleus"
id = "layout-text-replacement"
title = "Per-occurrence text identity and visual representation"
[[claims]]
id = "causal-identity"
level = "must"
statement = "TextReplacement preserves per-occurrence extractable text and positioned visual children; identity comes from selected cause, never suffix, GID, position or appearance comparison."
[[claims]]
id = "visual-transport"
level = "must"
statement = "Metrics, font resources, shaping, drawing and transforms use children exactly once and preserve envelope; text creates no advance, measurement or drawing."
[[claims]]
id = "occurrence-extraction"
level = "must"
statement = "Extraction replaces children with occurrence text without duplication; replacement never remaps other items sharing font/glyph."
[[claims]]
id = "static-boundary"
level = "must-not"
statement = "Do not erase TextReplacement in coalescing/reflow, merge its children with external text or reuse Alt/structure tree as text identity; dispatch remains static."