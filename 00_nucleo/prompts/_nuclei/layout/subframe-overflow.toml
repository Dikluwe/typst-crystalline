tekt = 1
kind = "nucleus"
id = "layout-subframe-overflow"
title = "Ordinary isolated-frame overflow"
[[claims]]
id = "local-overflow"
level = "must"
statement = "During isolated sub-layout (is_sub_frame), ordinary shape/line geometric overflow remains in local frame, without advancing outer page/column or rejecting caller's flow transaction. Caller decides returned frame size, composition and clipping."
[[claims]]
id = "outer-flow"
level = "must"
statement = "Outside isolated sub-layout preserve paged-flow admission/progress/overflow-rejection predicates, including float reservations and column advancement. This invariant neither turns explicit pagebreak requests into ordinary overflow nor authorizes suppressing them."