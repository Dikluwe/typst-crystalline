tekt = 1
kind = "nucleus"
id = "layout-text-separators"
title = "Text separator provenance and transport"
[[claims]]
id = "causal-separator"
level = "must"
statement = "TextSeparator represents one layout-retained U+0020 occurrence with Markup, Newline or Literal origin; never infer separators from kerning, tracking or position gaps."
[[claims]]
id = "neutral-ink"
level = "must"
statement = "TextSeparator adds no ink, ascent, descent, baseline, height, line or terminal content width; advance transports width already assigned by layout without duplicating it in cursor."
[[claims]]
id = "transport"
level = "must"
statement = "Translations, direction, groups, links, envelopes and rollback preserve occurrence/causal order; adding separators never changes prefix certified by length checkpoints."
[[claims]]
id = "text-output"
level = "must"
statement = "Export preserves actual separator as extractable text space with supplied font identity/position; adjacent fragments without a carrier remain adjacent."