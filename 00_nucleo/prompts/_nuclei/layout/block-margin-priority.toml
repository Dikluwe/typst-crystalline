tekt = 1
kind = "nucleus"
id = "block-margin-priority"
title = "Causal priority of relative margins between blocks"
[[claims]]
id = "presence-before-magnitude"
level = "must"
statement = "Between adjacent relative margins in the block protocol, explicit dominates automatic even when zero or smaller. Within one class retain maximum. Class derives from causal above/below/spacing presence, never value comparison."
[[claims]]
id = "heading-strength"
level = "must"
statement = "Heading's own margins are explicit under the existing protocol. Previous automatic margin does not enlarge its above, nor does next block's automatic above enlarge its below."
[[claims]]
id = "scope-limit"
level = "must-not"
statement = "This contract does not certify fractional spacing, strong vspace, sticky headings, hanging-indent or mixed-run metrics. Do not change causal start/end, top-edge, region or Length-resolution formulas because of this priority."