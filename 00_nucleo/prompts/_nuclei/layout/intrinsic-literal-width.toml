tekt = 1
kind = "nucleus"
id = "intrinsic-literal-width"
title = "Intrinsic container extent and literal space"
[[claims]]
id = "intrinsic-extent"
level = "must"
statement = "For a text frame's intrinsic extent combine visual extent with pos.x + advance of actually emitted Literal TextSeparator items; never add global cursor, invent space or duplicate tracking."
[[claims]]
id = "ink-distinction"
level = "must-not"
statement = "Intrinsic projection does not change line_content_right used for line/ink alignment; terminal Markup/Newline separators do not enlarge intrinsic extent."