tekt = 1
kind = "nucleus"
id = "text-segment-scope"
title = "Lexical text-segment scope and multiline prefix"
[[claims]]
id = "lexical-owner"
level = "must"
statement = "A segment starting without an open exterior line installs its lexical chain; partial descent through wrappers inherits the exterior segment's owning chain until a block boundary. Equal sibling-run values create no lexical ancestor."
[[claims]]
id = "geometric-prefix"
level = "must"
statement = "A previously refused certified multiline text prefix may measure/emit lines under the same common chain: leading derives from chain, top/bottom from each line's material units. Reconcile predicted baseline with actual top, including a smaller one. Reservation counts causal height and margin once."
[[claims]]
id = "isolation"
level = "must"
statement = "Owning chain and geometric mode are private/lexical, included in checkpoints/rollback, suspended in isolated subframes and restored on exit. Isolated text measurement executes no opaque unit, effect or callback and does not alter emitter."
[[claims]]
id = "legacy"
level = "must"
statement = "Previously certified scalar prefixes retain hooks/formulas; new multiline path never applies scalar wrap adjustments. Refused units, uncertified bidi, floats and nontext bodies retain prior paths."