tekt = 1
kind = "nucleus"
id = "raw-defaults"
title = "Raw render defaults and show-set precedence"
[[claims]]
id = "default-style"
level = "must"
statement = "In render Raw uses DejaVu Sans Mono and 0.8 of exterior size before explicit overrides; show replacement retains this default scope. Exterior fill is inherited and initial bold/italic disabled."
[[claims]]
id = "scope-once"
level = "must"
statement = "Private raw.defaults marker transports style boundary only, no geometry; raw.defaults.active prevents double application to Raw returned by it. Inner Styled overrides prevail and em lengths resolve against prior size within this scope. Restore exterior afterward."
[[claims]]
id = "geometry-phase"
level = "must-not"
statement = "Show preparation chooses no coordinates, measures no fonts and executes no layout; renderer executes no recipe. Create no public field, trait or new phase for these defaults."