tekt = 1
kind = "nucleus"
id = "bibliography-plan"
title = "Private bibliography-entry plan"
[[claims]]
id = "ordered-entries"
level = "must"
statement = "Preserve CSL entry order/boundaries, optional prefix and Content body. Any entry prefix selects columns for the list; without prefixes distinguish hanging/plain by CSL indication. Never infer prefixes from already concatenated text."
[[claims]]
id = "private-transport"
level = "must"
statement = "The plan is layout-private, immutable and Arc-shared across attempts/checkpoints; rollback retains the complete plan. Add no BibRenderCache fields or public signature changes. Execute no callbacks, new introspection or extra CSL pass to reconstruct boundaries."
[[claims]]
id = "language-not-mechanics"
level = "must"
statement = "Public cache retains prior Content composition. Physical consumer uses typed boundaries/existing containers without adding semantic Grid/Block/Place occurrences or artificial Location. Temporarily incomplete hanging must stay explicit in L0/results, not certified by column improvement."