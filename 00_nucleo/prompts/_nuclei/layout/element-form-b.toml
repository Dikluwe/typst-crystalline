tekt = 1
kind = "nucleus"
id = "layout-element-form-b"
title = "Feature delegation in Form B"
[[claims]]
id = "thin-exhaustive-arm"
level = "must"
statement = "Central dispatcher retains exhaustive match with thin arms delegating statically to feature functions."
[[claims]]
id = "render-owned-function"
level = "must"
statement = "Feature layout/introspection logic lives in its feature module within the consuming layer, as a descendant free function."
[[claims]]
id = "no-reverse-import"
level = "must-not"
statement = "Domain entities do not import Layouter or introspection engine; atomization creates no data-to-render coupling."
[[claims]]
id = "no-dynamic-dispatch"
level = "must-not"
statement = "Atomization introduces no dyn, vtable, PropMap or wildcard and removes no imports needed for exhaustiveness."
[[claims]]
id = "content-preserving"
level = "must"
statement = "Moving or maintaining feature boundaries preserves behavior; any observable change requires its own measurement/decision."