tekt = 1
kind = "nucleus"
id = "link-frame-scopes"
title = "Links preservam fragmentos e limites de fluxo"

[[claims]]
id = "capture-fragments-once"
level = "must"
statement = "O corpo de um link é disposto uma vez. Seus fragmentos continuam na linha, página, coluna e referencial de origem; prefixos/sufixos e emissões alheias não se tornam clicáveis. Limites privados de escopo acompanham os frames sem contribuir para geometria e são retirados antes da saída pública."

[[claims]]
id = "composition-and-rollback"
level = "must"
statement = "Fechamento de linha/região segmenta a captura sem deslocar conteúdo nem invalidar fixups. Subframes transportam a pertença lexical, marginais não a herdam acidentalmente, emissões diferidas conservam a pertença capturada e checkpoints restauram registro/escopos/frames coerentemente."
