tekt = 1
kind = "nucleus"
id = "link-frame-scopes"
title = "Links preserve fragments and flow boundaries"
[[claims]]
id = "capture-fragments-once"
level = "must"
statement = "Lay out a link body once. Its fragments retain original line, page, column and frame; unrelated prefixes/suffixes/emission never become clickable. Private scope boundaries follow frames without geometry contribution and are removed before public output."
[[claims]]
id = "composition-and-rollback"
level = "must"
statement = "Line/region closure segments capture without moving content or invalidating fixups. Subframes transport lexical membership, marginals do not inherit it accidentally, deferred emissions retain captured membership, and checkpoints coherently restore registry/scopes/frames."