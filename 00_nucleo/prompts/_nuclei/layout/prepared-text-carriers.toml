tekt = 1
kind = "nucleus"
id = "prepared-text-carriers"
title = "Text inspection of already realized content"
[[claims]]
id = "visual-projection"
level = "must"
statement = "Text certification inspects Source.body, Located.body and Realized.visual as transparent envelopes, keeping Styled, Strong and Emph as style owners and each certificate's own typographic criteria. Realized.original does not participate in visual measurement."
[[claims]]
id = "read-only"
level = "must"
statement = "Projection is borrowed and executes no ShowRecipe/callbacks, emits nothing and changes no original content, Location, tags or origin. Uncertified content retains refusal and prior path."