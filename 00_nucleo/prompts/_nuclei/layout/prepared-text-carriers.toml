tekt = 1
kind = "nucleus"
id = "prepared-text-carriers"
title = "Inspeção textual de conteúdo já realizado"

[[claims]]
id = "visual-projection"
level = "must"
statement = "Certificação textual inspeciona Source.body, Located.body e Realized.visual como envelopes transparentes, mantendo Styled, Strong e Emph como donos dos estilos e conservando os critérios tipográficos próprios de cada certificado. Realized.original não participa da medição visual."

[[claims]]
id = "read-only"
level = "must"
statement = "A projeção é emprestada e não executa ShowRecipe/callbacks, não emite nem altera o conteúdo original, Location, tags ou origem. Conteúdo não certificado conserva a recusa e o caminho anterior."
