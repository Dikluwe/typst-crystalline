tekt = 1
kind = "nucleus"
id = "layout-coordinates"
title = "Coordinate, region and rebase composition"
[[claims]]
id = "absolute-region"
level = "must"
statement = "Sub-layout identifies actual origin in its declared frame: page-absolute or local to an explicit frame. In a local frame the result carries page transform. Recomposing adds only incremental displacement, never the complete origin again."
[[claims]]
id = "same-rebase"
level = "must"
statement = "FrameItems, decoration segments, observable positions and orphan fixups undergo the same transform/frame in direct merges, groups and deferred emission."
[[claims]]
id = "lifo-region"
level = "must"
statement = "Region, cursor and collector state save/restore in LIFO; local state never leaks into parent frame."
[[claims]]
id = "observable-geometry"
level = "must"
statement = "Acceptance compares observable geometry/morphology; buffer structure, paths and rebase steps are internal mechanics."