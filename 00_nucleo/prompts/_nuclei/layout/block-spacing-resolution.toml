tekt = 1
kind = "nucleus"
id = "block-spacing-resolution"
title = "Automatic Block margin resolution"
[[claims]]
id = "ambient-fallback"
level = "must"
statement = "Block margins resolve explicit above/below, then explicit spacing, then effective-chain par.spacing Length, finally PAR_SPACING times effective size. Explicit zero is presence, never absence."
[[claims]]
id = "allocation-and-emission"
level = "must"
statement = "Emission and fractional reservation use the same margin resolution in each path's known scope. This certifies neither lost lexical scope, neighboring collapse strength nor general fractional-tail measurement."