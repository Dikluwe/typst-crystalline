tekt = 1
kind = "nucleus"
id = "text-tracking"
title = "Text boundaries and tracking precision"
[[claims]]
id = "eligible-boundary"
level = "must"
statement = "In incremental LTR uniform nonmath text, each consecutive same-line text-unit pair receives one tracking; line start and objects interrupt pairs. Literal spaces are distinct units, not constant multipliers."
[[claims]]
id = "selection-width"
level = "must"
statement = "The interval before a material unit participates in wrap/hyphenation position selection and applies only if unit remains on that line; never move it to next-line start."
[[claims]]
id = "fractional-advance"
level = "must"
statement = "Residue between exact point tracking and font-stored integer tracking applies only before a different next cluster; subrun positioning, reconciliation and PDF use the same derived extent without extra Tc or glyph/public contract changes."
[[claims]]
id = "limits"
level = "must-not"
statement = "Do not generalize uniform-boundary correction to RTL, math, objects or differing styles without controls; do not enable global tracking preparation or claim selection parity for unmeasured ligatures/scripts."