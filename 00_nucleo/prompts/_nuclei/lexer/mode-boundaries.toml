tekt = 1
kind = "nucleus"
id = "lexer-mode-boundaries"
title = "Lexer mode boundaries"
[[claims]]
id = "single-dispatch"
level = "must"
statement = "After universal tokens the hub delegates each token exactly to the active SyntaxMode handler."
[[claims]]
id = "consumed-prefix"
level = "must"
statement = "Mode handler receives start byte and already consumed first scalar, advancing only through the same token's contiguous suffix."
[[claims]]
id = "parser-controls-mode"
level = "must"
statement = "SyntaxMode changes belong to parser via set_mode; lexical handlers never change mode independently."
[[claims]]
id = "universal-precedence"
level = "must"
statement = "Hub recognizes whitespace, initial shebang, comments and end before mode-specific rules; raw is also universal outside Math."
[[claims]]
id = "no-mode-bleed"
level = "must-not"
statement = "A Code-, Markup- or Math-exclusive rule is applied while another SyntaxMode is active."