tekt = 1
kind = "nucleus"
id = "pdf-conic-placement"
title = "Physical PDF conic pattern placement"
[[claims]]
id = "initial-space"
level = "must"
statement = "Conic pattern receives reference-box transform into initial PDF stream space including position,nested affine groups,page reflection and bleed. Later paint cm never substitutes for that transform."
[[claims]]
id = "occurrence-binding"
level = "must"
statement = "Discovery,page resources and painting resolve same pattern by Shape occurrence and gradient identity during one immutable-document export. Reusing Arc at another occurrence loses no position/box/transform/page height; same-occurrence fill/stroke may share pattern."
[[claims]]
id = "reference-box"
level = "must"
statement = "Conic self/auto uses Shape box; parent uses parent_bbox_at_emit in Shape frame when present,else immediate-group local box or page. Transparent envelopes retain coordinate frame."