tekt = 1
kind = "nucleus"
id = "package-downloader-contract"
title = "Package download boundary"
[[claims]]
id = "domain-errors"
level = "must"
statement = "Boundary exposes only domain errors, never external HTTP/I/O types."
[[claims]]
id = "preview-identity"
level = "must"
statement = "Download preserves requested namespace, name and version specification."
[[claims]]
id = "io-in-infra"
level = "must-not"
statement = "Network, filesystem or client types cross into L1."