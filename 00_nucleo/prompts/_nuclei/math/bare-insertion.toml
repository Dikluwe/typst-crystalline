tekt = 1
kind = "nucleus"
id = "math-bare-insertion"
title = "Mathematical insertion and automatic equation identity"
[[claims]]
id = "insertion-boundary"
level = "must"
statement = "Mathy inserted outside mathematical context becomes Equation before show, identity and introspection; original evaluated value retains its morphology."
[[claims]]
id = "math-boundary"
level = "must-not"
statement = "Preparation creates no Equation inside descendants already in Equation/Mathy body and wraps neither ordinary text nor isolated math styling."
[[claims]]
id = "lexical-scope"
level = "must"
statement = "Automatic Equation resolves block/effective properties in insertion scope; later rules never act retroactively, and product rules retain causal lexical snapshot."
[[claims]]
id = "occurrence"
level = "must"
statement = "Each fresh bare insertion receives its own Equation identity; aliases of prepared it retain identity, consumed origins are not reemitted and new bodies resume realization."
[[claims]]
id = "single-evaluation"
level = "must-not"
statement = "Math preparation never reevaluates source/argument, executes constructor for variant recognition or duplicates effects/context-producer executions."
[[claims]]
id = "label-boundary"
level = "must-not"
statement = "Original Mathy label is not promoted to automatic Equation; invent no label property or known snapshot."