tekt = 1
kind = "nucleus"
id = "math-matrix-morphology"
title = "Public mat morphology and field presence"
[[claims]]
id = "rows"
level = "must"
statement = "rows preserves row/cell order, empty padding and morphological content; render never substitutes these data."
[[claims]]
id = "presence"
level = "must"
statement = "delim, align, augment, row-gap and column-gap are known only when their explicit bits are true; rows is always known. gap is shorthand, not a field."
[[claims]]
id = "native-identity"
level = "must"
statement = "The public element is named mat and func projects the actual native by static identity, without invoking constructor or using name as identity."