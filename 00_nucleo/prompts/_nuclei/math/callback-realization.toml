tekt = 1
kind = "nucleus"
id = "math-callback-realization"
title = "Realization of geometry-dependent math callbacks"
[[claims]]
id = "pure-layout"
level = "must-not"
statement = "The layouter executes no Func, Engine or World; it only produces pure requests and consumes validated resolutions."
[[claims]]
id = "provisional-not-success"
level = "must-not"
statement = "A pass with pending request, stale store or nonconvergent transcript cannot be exported or returned as successful compilation."
[[claims]]
id = "stable-request-identity"
level = "must"
statement = "Each request is identified by Equation Location, structural occurrence reserved once on element entry before body descent, and line index; Span is diagnostic only."
[[claims]]
id = "concrete-attempt-scope"
level = "must"
statement = "Each concrete Layouter attempt has fresh transcript state; rejected internal attempts discard their transcripts, and only a stabilized candidate attempt may feed later phases."
[[claims]]
id = "pipeline-realization"
level = "must"
statement = "Pipeline realizes requests in order through Engine/captured style, validates Angle and supplies a complete store to the next pass."
[[claims]]
id = "one-request-per-language-call"
level = "must"
statement = "Request cardinality preserves language calls; cancel cross executes callback once per line."