tekt = 1
kind = "nucleus"
id = "watch-source-generation"
title = "Syntax reuse validated per edit"
[[claims]]
id = "exact-current-source"
level = "must"
statement = "Syntax hit requires successful current read,equal physical canonical path,current-World FileId/full UTF-8 text;hash/metadata insufficient."
[[claims]]
id = "fresh-world"
level = "must"
statement = "IDs/maps/dependencies/bytes/inputs/plugins/clock/other caches remain per World;session never restores IDs or skips current resolution/registration."
[[claims]]
id = "syntax-only"
level = "must-not"
statement = "Do not store Module,Func,effect,emitted diagnostic,frame,Location,font/transient in session;only immutable physical markup Source,without phase/evaluation change."
[[claims]]
id = "bounded-lifetime"
level = "must"
statement = "Session belongs to one watch call,no global/disk/unsafe,LRU bounded to8 entries,1MiB total text,512KiB per entry;budget promises no RSS bound."