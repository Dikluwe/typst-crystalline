tekt = 1
kind = "nucleus"
id = "math-attach-slot-presence"
title = "Three-state presence of math.attach slots"
[[claims]]
id = "closed-carrier"
level = "must"
statement = "MathAttach slots t, b, tl, bl, tr and br use closed MathAttachSlot enum with exactly Omitted, ExplicitNone and Present(Content)."
[[claims]]
id = "state-meaning"
level = "must"
statement = "Omitted means absent argument; ExplicitNone explicitly supplied none; Present(content) present content argument, including Content::Empty."
[[claims]]
id = "construction-preservation"
level = "must"
statement = "MathAttach constructors, transformations and reconstructions preserve every slot state without collapsing ExplicitNone or Present(Content::Empty) into Omitted or each other."
[[claims]]
id = "compatible-projection"
level = "must"
statement = "Compatible sup/sub projections return Option<&Content> only from Present(Content), preserving tr over t and br over b precedence; Omitted/ExplicitNone project None."
[[claims]]
id = "repr-projection"
level = "must"
statement = "Public representation omits Omitted, prints none for ExplicitNone and canonical content representation for Present(Content), so Present(Content::Empty) is []."
[[claims]]
id = "layout-projection"
level = "must"
statement = "Only Present(Content) creates script box and counts as presence for SpaceAfterScript even without ink/width; Omitted/ExplicitNone behave as omission in layout."
[[claims]]
id = "surface-convergence"
level = "must"
statement = "Math syntax, qualified call, semantic access and every reconstruction converge on the same carrier, preserving contracted order/spans/diagnostics/evaluation."
[[claims]]
id = "no-sentinel-or-heuristic"
level = "must-not"
statement = "No consumer may infer presence from Content::Empty, text, character, function name, width, ink, font, span, coordinate, fixture constant or another sentinel/heuristic."
[[claims]]
id = "no-global-carrier"
level = "must-not"
statement = "This obligation creates no generic Settable or change to parser, AST, Args, Value, global Content algebra/variants, global state or pipeline phase."
[[claims]]
id = "no-unconfirmed-expansion"
level = "must-not"
statement = "Carrier changes no defaults, compatibility outside confirmed MathAttach signature, non-MathAttach layout or public contracts beyond enum and six-slot constructors/reconstructions."