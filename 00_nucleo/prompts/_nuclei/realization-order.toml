tekt = 1
kind = "nucleus"
id = "realization-order"
title = "Occurrence identity and causal realization order"
[[claims]]
id = "identity-is-not-order"
level = "must-not"
statement = "Internal Location number does not represent document order when occurrences prepare before transformation. Never sort queries,states,counters or their events by raw id when causal order is recorded."
[[claims]]
id = "causal-order"
level = "must"
statement = "Introspection walk records tags' first-occurrence order. Temporal consumers use it for prefixes/comparisons;prepared-occurrence aliases retain identity without duplicate records. Isolated tests without walk may retain numeric fallback from Locator."