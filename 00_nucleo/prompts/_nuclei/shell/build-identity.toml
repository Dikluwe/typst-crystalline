tekt = 1
kind = "nucleus"
id = "shell-build-identity"
title = "Identidade cristalina do build no CLI"

[[claims]]
id = "compile-time-channel"
level = "must"
statement = "A identidade do commit flui por TYPST_COMMIT_SHA em tempo de compilação."

[[claims]]
id = "human-display"
level = "must"
statement = "O commit exibido deriva do valor do build e só a apresentação humana pode abreviá-lo."

[[claims]]
id = "runtime-fallback"
level = "must"
statement = "Ausência de Git ou variável possui fallback explícito sem I/O em runtime."

[[claims]]
id = "provenance-distinction"
level = "must-not"
statement = "Não confundir commit cristalino, commit vanilla e versão do crate."
