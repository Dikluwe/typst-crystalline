tekt = 1
kind = "nucleus"
id = "text-size-affine"
title = "Complete declared text size and contextual resolution"
[[claims]]
id = "declared-versus-resolved"
level = "must"
statement = "Declared text size retains full Length(abs/em);render TextStyle retains resolved Pt. Already resolved layout/math values travel as absolute Length without regaining em factor."
[[claims]]
id = "affine-composition"
level = "must"
statement = "Composing inner size(ai,ei) over outer(ao,eo) gives(ai + ei*ao,ei*eo) in lexical order. Absence declares no style;em=0 is absolute override;final default remains11pt. Capture/collapse preserve composed Length without assuming absent base."
[[claims]]
id = "surface-separation"
level = "must"
statement = "Constructor retains Styled presence/body;set retains lexical transport. Rust structural equality/language equality are neither conflated nor used as render shortcuts. Complete type alone does not prove Styled equality correctness."
[[claims]]
id = "heading-show-set-order"
level = "must"
statement = "Heading built-in relative size precedes a matching show-set declaration: its absolute part is not multiplied by the built-in scale. Keep declared Length intact in eval; correct the local layout formula with explicit show-set provenance, preserving ordinary global/constructor sizes and restoration."