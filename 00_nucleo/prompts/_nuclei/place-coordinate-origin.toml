tekt = 1
kind = "nucleus"
id = "place-coordinate-origin"
title = "Place body geometric origin and parent frame"
[[claims]]
id = "body-origin"
level = "must"
statement = "Nonfloating Place body is composed once from geometric origin;text installs own baseline,shape acquires no font strut. Translate to parent once for items,decoration,positions,fixups."
[[claims]]
id = "parent-origin"
level = "must"
statement = "Subframe explicitly retains caller-required vertical recomposition origin:zero geometric,start_y legacy baseline. Place uses that origin for subframe anchoring,never current font or mutable pending-baseline inference."
[[claims]]
id = "pending-flow"
level = "must"
statement = "Without explicit vertical alignment,a pending line anchors Place at current physical baseline;geometric body adds only own geometry. Explicit Top anchors region top,not pending line."
[[claims]]
id = "lifo-checkpoint"
level = "must"
statement = "Subframe origin is pure internal state saved/restored in LIFO and captured/restored with tail checkpoint;no sibling/attempt leak. No phase/public API/default/topology change."