tekt = 1
kind = "nucleus"
id = "pdf-group-local-space"
title = "PDF group-local coordinates"
[[claims]]
id = "local-y-down"
level = "must"
statement = "After page group establishes local Y-down,descendant geometry/clips use it; nested groups compose affine matrices without repeating page reflection. Text/image adaptations never change group space."
[[claims]]
id = "scoped-geometry"
level = "must"
statement = "Group transform/clip affects descendants and restores before siblings; clip path uses same local coordinates as clipped content."