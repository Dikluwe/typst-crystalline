tekt = 1
kind = "nucleus"
id = "caption-projection"
title = "Projection of known FigureCaption fields"
[[claims]]
id = "public-projection-name"
level = "must"
statement = "Public textual projection of an isolated FigureCaption carrier uses func caption. Internal qualified figure.caption may remain mechanical; it does not justify another name in public serialization."
[[claims]]
id = "stored-body"
level = "must"
statement = "The FigureCaption carrier getter treats body as known, including Empty, and preserves stored Content. Projections without a snapshot publish that body recursively rather than replacing it with plain_text."
[[claims]]
id = "known-fields-order"
level = "must"
statement = "Known FigureCaption fields project in position, separator, body order; absent position and separator are not published through default inference. Existing snapshots remain authoritative under their own contracts."
[[claims]]
id = "no-standalone-synthesis"
level = "must-not"
statement = "Direct FigureCaption projection does not synthesize position, separator, kind, supplement, numbering, counter or location. Legacy Figure projection has a separate contract; its resolved-caption helper is not an isolated FigureCaption carrier serializer."