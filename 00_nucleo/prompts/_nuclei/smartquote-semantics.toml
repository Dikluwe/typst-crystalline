tekt = 1
kind = "nucleus"
id = "smartquote-semantics"
title = "Semantic quote identity and render context"
[[claims]]
id = "presence"
level = "must"
statement = "Omitted quote property remains absent;explicit false is present and distinct from default/inheritance."
[[claims]]
id = "semantic-leaf"
level = "must"
statement = "Markup/constructor quotes retain SmartQuote and known fields during eval;disabled never erases element."
[[claims]]
id = "late-render"
level = "must"
statement = "Target render selects glyph with explicit properties above active chain/defaults;prior capture never bakes language/enabled."
[[claims]]
id = "causal-context"
level = "must"
statement = "Quote context follows logical post-show flow and fully restores on replay;it is neither global nor retained across documents."
[[claims]]
id = "target-boundary"
level = "must-not"
statement = "HTML does not enter paged layout to resolve quotes;targets use pure helper and retain their own escaping/composition."
[[claims]]
id = "linguistic-acceptance"
level = "must"
statement = "Acceptance measures language identity/fields,glyphs/styles;stack/frame/PDF-byte organization never justifies copying upstream mechanics."