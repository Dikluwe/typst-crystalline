tekt = 1
kind = "nucleus"
id = "eval-core"
title = "Explicit context and eval causality"
[[claims]]
id = "explicit-state"
level = "must"
statement = "Evaluation state is transported explicitly through Engine, Scopes and EvalContext; no mutable global eval state exists."
[[claims]]
id = "source-spans"
level = "must"
statement = "Values, diagnostics and events preserve available causal spans; detached span is permitted only when input has no syntactic origin."
[[claims]]
id = "flow-transport"
level = "must"
statement = "FlowEvent preserves the first event and propagates to the semantic boundary consuming it; a residual event at the entrypoint is an error."
[[claims]]
id = "static-ownership"
level = "must"
statement = "Dispatch remains exhaustive and static; each specialized domain retains its semantics in its owning module."