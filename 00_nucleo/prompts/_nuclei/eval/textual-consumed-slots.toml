tekt = 1
kind = "nucleus"
id = "textual-consumed-slots"
title = "Consumed slots and genuine children in textual transport"
[[claims]]
id = "consumed-only"
level = "must"
statement = "Text capture or splice explicitly records consumed vector slots. They preserve indices until lexical closure and do not reappear as language children. Genuine Empty or empty Text is not inferred consumed merely from its content."
[[claims]]
id = "lexical-fold"
level = "must"
statement = "Body and consumption mask fold together in reverse existing-boundary order. Each lexical product occupies an unconsumed slot; retained recipes, styles, snapshots, origins and child order keep their causality. Captured visual assembly also removes only marked slots."