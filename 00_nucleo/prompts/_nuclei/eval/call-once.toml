tekt = 1
kind = "nucleus"
id = "eval-call-once"
title = "Resolution and effects once per call"
[[claims]]
id = "receiver-ownership"
level = "must"
statement = "A call retains its actually resolved receiver through interceptors and fallback. Cache is call-local, not global/text-keyed memoization; collection clones do not replace ownership transfer and borrowing."
[[claims]]
id = "lazy-arguments"
level = "must"
statement = "Resolve method/callee and gates before ordinary call arguments; unknown methods execute no arguments. Collections evaluate arguments only after recognizing an operation in the single static table, once with spans/occurrences intact."
[[claims]]
id = "mutating-order"
level = "must"
statement = "Mutating methods preserve the special arguments, mutable place, operation order. If a place permits callable-field fallback, transport the resolved receiver and already evaluated Args; never reevaluate target/arguments or mutate a temporary copy."
[[claims]]
id = "callee-fallback"
level = "must"
statement = "Selectors, content and contextual interceptors retain receivers/callee when not intercepting; final dispatch receives resolved value and Args, preserving field-access, span, trace, context, alias and priority policies."
[[claims]]
id = "no-compensating-effects"
level = "must-not"
statement = "Identify a function by name to isolate scopes, truncate arrays, erase effects or compensate evaluation counts. Mathematical arguments follow one normal causal evaluation; mathematical preparation/insertion retains its own phase and carriers."
[[claims]]
id = "static-surface"
level = "must"
statement = "Preserve external Rust APIs, static method catalog and Tekt extensions, callbacks, argument schema, defaults and L1 purity. No vtable, dynamic registry, new feature or phase change is authorized."