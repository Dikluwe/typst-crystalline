tekt = 1
kind = "nucleus"
id = "textual-recipe-frontier"
title = "Lexical scope, precedence and causal protection of textual products"
[[claims]]
id = "inherited-versus-owned"
level = "must"
statement = "Distinguish inherited insertion rules from rules introduced by a value's lexical tail. Inheritance does not freeze an obsolete global rule into a value; local delta stays more inward at insertion. Compose by RuleId identity without duplication and with lexical order. Never infer scope from name, product text, numeric ID or body equality."
[[claims]]
id = "one-text-selector-order"
level = "must"
statement = "Literal and regex compete in the same eligible group: select smallest UTF-8 start, ties favoring the innermost/latest unrevoked lexical rule. Do not select every occurrence of one selector before competitors; ignore empty matches. Preserve prefix, product and suffix in causal order."
[[claims]]
id = "guarded-product"
level = "must"
statement = "Textual revocation belongs to the selected occurrence's product, including returned aliases; it does not contaminate prefix, suffix or siblings. Completed products bound grouping: do not merge independent products or product+sibling to fabricate a match. Remaining eligible rules may act within a composite product emitted as one unit. Distinguish alias from fresh construction and never repeat completed callbacks."
[[claims]]
id = "root-before-emitted-children"
level = "must"
statement = "Decide the effective root recipe before realizing children it may hide; visit only actually emitted product. Text functions evaluate code once, capturing content recipes for later causal realization; never execute child callbacks merely while constructing the result. Restore guards, rules, styles, file and context namespace on success and error."
[[claims]]
id = "private-transport"
level = "must"
statement = "Use existing public types and private compilation-local state only. Internal frames distinguish inherited base/local delta; private ShowRecipe/styles carry classification without new public fields. Realized.original may retain recipe/guard provenance separately from emitted visual, without false Location. Never execute metadata, expose internal keys in fields/repr, alter it identity or flatten author-written Sequence. No I/O, globals, vtables, PropMap or unsafe."
[[claims]]
id = "spaces-and-style"
level = "must"
statement = "Normalize Space/SpaceFromNewline in emitted flow before matching; whitespace-containing Text remains eligible text. Distinguish consumed emptiness from explicit Empty. Textual show-set applies actual Styles only to match/product with causal precedence/guards, not siblings. Source, styles, labels and UTF-8 survive slicing/recomposition."
[[claims]]
id = "bounded-work"
level = "must"
statement = "Share immutable snapshots through Arc and represent runs as UTF-8 ranges, without per-byte state vectors or full rule copies per character. Use existing depth budget and observed effect order; presume no performance result. Preserve Table→placement→Cell→body, Mathy preparation before selection and lazy State/Counter realization."