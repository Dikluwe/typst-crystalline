tekt = 1
kind = "nucleus"
id = "pending-text"
title = "One causal text group per pending realization"
[[claims]]
id = "same-causal-group"
level = "must"
statement = "Pending text packages from the same causal environment represent one realization: identical rule Arc identity, collapsed styles, guards and file. Coalescing executes no callbacks and preserves Source, order and boundaries of distinct environments or nontext recipes with element effects. A generic scalar Text recipe without an applicable element rule, with identical ordered rule identities and parent environment, creates no extra textual boundary."
[[claims]]
id = "slots-are-not-occurrences"
level = "must"
statement = "Empty normalization/consumption slots in the markup vector are not language Empty occurrences. When constructing Sequence tails and text packages discard bare transport slots; preserve explicit captured occurrences, Source/ShowRecipe and immediate constructor children. Do not filter domain arrays or empty Text."
[[claims]]
id = "sequence-transport-is-not-textual-scope"
level = "must"
statement = "In text-package coalescing, private Sequence transport marks and Sequence-rule guards do not distinguish textual scopes. Actual styles, other rule guards, file and effective rule identities remain causal. Lexical grouping before capture retains its strict boundaries."