tekt = 1
kind = "nucleus"
id = "eval-observation-relation"
title = "Causal eval observation relation"
[[claims]]
id = "separate-from-language-equality"
level = "must"
statement = "The observation relation is internal to eval stabilization and separate from PartialEq, Hash and public Typst language equality."
[[claims]]
id = "closed-result"
level = "must"
statement = "Each comparison produces Same, Different or Unproven; Unproven never certifies stability and invalidates reuse."
[[claims]]
id = "causal-structure"
level = "must"
statement = "Structural comparisons preserve variant, order, presence, content and causal metadata; floats compare IEEE bits, including signed zero and NaN payload."
[[claims]]
id = "opaque-values"
level = "must"
statement = "Opaque services or values are Same only with proof of immutable causal identity; absent proof produces Unproven."
[[claims]]
id = "pure-and-local"
level = "must"
statement = "Comparison is pure and memory-local, executing no callbacks, layout, I/O or cascade resolution."