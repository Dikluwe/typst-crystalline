tekt = 1
kind = "nucleus"
id = "eval-source-validation"
title = "Source validation before typed AST access"
[[claims]]
id = "validate-before-eval"
level = "must"
statement = "Document, expression, import and include sources are syntactically validated before typed-node visits or program execution. Any fatal error prevents evaluation, prefix effects, bindings and partial styles."
[[claims]]
id = "causal-diagnostics"
level = "must"
statement = "Errors preserve order, message, actual source span and every parser hint. Do not catch panic instead of validation, reanchor everything to the importer or swallow errors as None."
[[claims]]
id = "warnings-remain-warnings"
level = "must"
statement = "NoTextWithinStars and NoTextWithinUnderscores are nonfatal warnings. Keep normalized empty-markup spans and hints even alongside errors; send to the existing Sink deduplicating by origin/message. Do not generalize other failures to warnings."
[[claims]]
id = "static-ownership"
level = "must"
statement = "The single pure collector classifies SyntaxErrorKind exhaustively and remains eval-restricted. Callers supply warnings channel, retain routing/isolation/context and apply import/include traces at existing boundaries. No I/O, globals or public API."