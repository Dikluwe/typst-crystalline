tekt = 1
kind = "nucleus"
id = "wiring-cli-observables"
title = "typst CLI process observables"
[[claims]]
id = "exit-codes"
level = "must"
statement = "Process returns0 on success,1 for semantic compilation/evaluation failure,2 for invalid arguments/I/O."
[[claims]]
id = "stream-discipline"
level = "must"
statement = "Human diagnostics go to stderr;value/list commands use stdout under their format."
[[claims]]
id = "compile-artifact"
level = "must"
statement = "Successful Compile publishes nonempty artifact at selected destination and never uses stdout for file destination."
[[claims]]
id = "no-partial-success"
level = "must-not"
statement = "Compilation failure is reported as success or replaces valid watch artifact with partial output."