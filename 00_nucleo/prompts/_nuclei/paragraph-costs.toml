tekt = 1
kind = "nucleus"
id = "paragraph-costs"
title = "Text costs composed per field"
[[claims]]
id = "cast"
level = "must"
statement = "text.costs is dictionary with optional hyphenation, runt, widow, orphan, each Ratio. Validate in that order before rejecting unknown keys; negative costs are valid at pinned reference. Error spans complete dictionary value."
[[claims]]
id = "fold"
level = "must"
statement = "Lexical composition replaces supplied fields only; each absent field preserves exterior value and reaches default multiplier1. Empty dictionary never clears exterior values. Fields travel separately in custom text.costs.<campo> channel."
[[claims]]
id = "selection"
level = "must"
statement = "In certified global subset, optimized reads shared paragraph scope costs: hyphen base135 and runt100 times effective ratios. Consecutive hyphenated lines use same effective hyphen cost. Simple consults no penalties."
[[claims]]
id = "limits"
level = "must"
statement = "widow/orphan validation/transport alone does not implement pagination; paragraph_pagination owner applies protection in certified regional subset. Inner-fragment costs overrides neither replace shared paragraph costs nor form typographic barriers; whole scopes factor through existing realization before paragraph formation. Uncertified contexts retain declared limits without partial global selection or glyph-inferred style."
[[claims]]
id = "regional-prevention"
level = "must"
statement = "In prepared-paragraph subset with uniform vertical metrics, constant paged region and no notes/floats/columns, positive effective widow/orphan enables protection; zero/negative disables, not graded weights. Protect first two lines by orphan, last two by widow only from third index(zero-based i >= 2), and all three when both active and exactly three lines. Move only groups not fitting here but fitting entirely next region. Oversize groups create no loop/artificial empty page. Preserve uncertified fallback and never recalculate breaks during emission."