tekt = 1
kind = "nucleus"
id = "network-custom-ca-cert"
title = "Custom certificate authority for downloads"
[[claims]]
id = "precedence"
level = "must"
statement = "Present --cert overrides TYPST_CERT; absence of both preserves normal TLS roots."
[[claims]]
id = "tls-validation"
level = "must"
statement = "Supplied PEM certificates append to normal roots without disabling TLS validation or hostname checking."
[[claims]]
id = "confidentiality"
level = "must-not"
statement = "Expose certificate path or bytes in Debug, remote diagnostics or info; only configuration presence may be observable."
[[claims]]
id = "download-scope"
level = "must"
statement = "Custom CA reaches every Crystalline-controlled package/index download through L2 injection into L4/L3."