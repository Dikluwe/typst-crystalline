tekt = 1
kind = "nucleus"
id = "stdlib-primitive-calls"
title = "Shared primitive-constructor call conventions"
[[claims]]
id = "native-abi"
level = "must"
statement = "Each constructor receives EvalContext,Args,World,FileId and returns SourceResult<Value>."
[[claims]]
id = "pure-l1"
level = "must"
statement = "Construction is pure in L1:neither I/O nor dependence on World/FileId effects."
[[claims]]
id = "consume-call"
level = "must"
statement = "Each accepted form explicitly consumes arguments;unexpected positional/named arguments produce diagnostics instead of silent discard."
[[claims]]
id = "typed-result"
level = "must"
statement = "A valid call returns the Value variant corresponding to called constructor."
[[claims]]
id = "owner-specific-coercion"
level = "must"
statement = "Specific forms,coercions/messages belong to each constructor's owning prompt,not this nucleus."