tekt = 1
kind = "nucleus"
id = "raw-field-presence"
title = "Lexical Raw field presence"
[[claims]]
id = "known-and-omitted"
level = "must"
statement = "Raw retains text and independent block/lang presence. Explicit block false/lang none never collapse into omission. text is always known in current model."
[[claims]]
id = "no-render-inference"
level = "must-not"
statement = "Field methods/encoders infer no presence from block false,lang None,inherited style or render. Defaults remain separate from lexically known fields."
[[claims]]
id = "transport"
level = "must"
statement = "Clone,Source,content/text maps,conservative observation and language equality preserve presence. No cache reuses different-presence Raw as if observable fields were equal."
[[claims]]
id = "public-projection"
level = "must"
statement = "Lexical projection order is text,block,lang;publish block/lang only when known. Present snapshot remains authoritative. Presence changes no realization phase or render defaults."