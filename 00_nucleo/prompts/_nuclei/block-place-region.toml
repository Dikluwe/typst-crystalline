tekt = 1
kind = "nucleus"
id = "block-place-region"
title = "Local Block geometric region for Place"
[[claims]]
id = "local-region"
level = "must"
statement = "Block installs a private Place region with its inner origin after inset and declared dimensions minus both insets. Auto height is resolved by the Block's own causal flow; overlays do not increase height. Do not use the page as the container's final size."
[[claims]]
id = "flow-origin"
level = "must"
statement = "Place optionally receives the already certified flow origin; only the omitted vertical axis uses it. Explicit alignment uses the local region. The body receives local width and is composed once. Items, decoration and metadata receive the same translation."
[[claims]]
id = "scope"
level = "must"
statement = "Block and checkpoints save and restore the private region, isolate it in subframes and invalidate it on physical-region transition. No public API or phase changes. Fragmented Block requires per-fragment regions before universal certification."
[[claims]]
id = "clip"
level = "must"
statement = "Clipping uses allocated container dimensions, including inset, and Group-local children; it cannot use Place's zero advance as explicit height or apply the origin twice. Deferred container corrections resolve before encapsulation; remaining paths follow the structure."