tekt = 1
kind = "nucleus"
id = "watch-font-generation"
title = "Per-generation font resources in watch"
[[claims]]
id = "fresh-files"
level = "must"
statement = "Each watch recompilation has new SystemWorld for Sources,bytes,FileIds/dependencies;font session retains none of these data or file-read errors."
[[claims]]
id = "paired-generation"
level = "must"
statement = "Book,slots/book-materialized coverage belong to same generation. Reuse requires equivalent current discovery in resource order/identity;changed generation receives no prior-generation-indexed caches."
[[claims]]
id = "fresh-on-uncertainty"
level = "must"
statement = "Validation refusal,error,change/instability never reuses old generation. Fresh path preserves discovery,order,fallback/resources observed on next recompilation."
[[claims]]
id = "bounded-session"
level = "must"
statement = "Session retains at most one generation for future reuse;active Worlds may retain own Arc. No global/persistent cache. Builder configuration discovers no fonts;catalog demand remains current phase."
[[claims]]
id = "exclude-unproven-caches"
level = "must-not"
statement = "Font retention extends no metrics,shaping,eval,layout,context,plugin,package/clock-observation lifetime;changes no World signature or unsafe."