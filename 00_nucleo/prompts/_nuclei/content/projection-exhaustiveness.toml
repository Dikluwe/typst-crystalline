tekt = 1
kind = "nucleus"
id = "content-projection-exhaustiveness"
title = "Nominal complements of Content projections"
[[claims]]
id = "closed-domain"
level = "must"
statement = "Each audited Content projection explicitly names handled cases and its current complement, so a future variant requires a compiler decision. No discard wildcard replaces this closed domain."
[[claims]]
id = "uniform-complement"
level = "may"
statement = "Alternatives with the same negative projection may share a body: false, None, Span::detached or complete delegation to existing hash. The owner prescribes responsibility and coverage for each V19 group without suppressing its note."
[[claims]]
id = "guard-refusal"
level = "must"
statement = "When a positive case has a guard, refusal preserves its prior path and its variant appears in the nominal complement. Unknown string fields remain open; do not confuse exhaustive Content handling with enumeration of every field name."
[[claims]]
id = "static-boundary"
level = "must-not"
statement = "Do not introduce a registry, vtable, I/O, global state or parallel classifier to replace static matches and their owners. Nominal repair changes no algorithms or public contracts; measured semantic exceptions require their own owner prescription."