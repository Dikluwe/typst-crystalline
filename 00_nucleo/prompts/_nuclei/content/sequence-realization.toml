tekt = 1
kind = "nucleus"
id = "sequence-realization"
title = "Sequence realization preserving scope and occurrence"
[[claims]]
id = "capture-before-flatten"
level = "must"
statement = "Insertion and selectable lexical Sequence tails preserve body and environment before flattening. Capture does not execute recipes; prefixes before a rule receive no future rules."
[[claims]]
id = "parent-before-hidden-children"
level = "must"
statement = "A marked Sequence recipe is decided before recipes and preparations of children it may hide. Only emitted content continues realization. Transport is private in RAM using existing public types."
[[claims]]
id = "nominal-guards"
level = "must"
statement = "An alias of it retains protection from RuleIds already applied to its occurrence; a fresh reconstruction does not inherit protection merely from equal children. Existing show-depth bounds new generations, without morphological fixpoint or fabricated Location."
[[claims]]
id = "preserve-other-owners"
level = "must-not"
statement = "Do not change Route limits, public interfaces, State/Counter/Heading phases, ordinary Styled transparency or other nonlocatable termination policies. Captures retain lexical rules/styles/guards/file and causal Source."