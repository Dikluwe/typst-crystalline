tekt = 1
kind = "nucleus"
id = "content-source-origin"
title = "Transparent lexical content origin"
[[claims]]
id = "first-origin"
level = "must"
statement = "Source origin establishes only a proven causal span; clones, aliases and spreads retain first origin without seeking names, text or equality to fabricate spans. Constructors already carrying origin retain it."
[[claims]]
id = "language-transparency"
level = "must"
statement = "Source is not a new language element: identity, fields, func, repr, serialization, equality and morphology observe its body. Origin is causal and may distinguish conservative cache observations."
[[claims]]
id = "single-occurrence"
level = "must"
statement = "Source transports one body occurrence; traversal, realization, layout and introspection do not duplicate callbacks, effects, geometry or contribution because of the wrapper. Clones preserve span and transformation preserves origin."
[[claims]]
id = "no-location"
level = "must-not"
statement = "Source fabricates no Location or independently introspectable producer, moves no logic between eval and layout and authorizes no L1 I/O."