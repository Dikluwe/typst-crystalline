tekt = 1
kind = "nucleus"
id = "markup-sequence-children"
title = "Immediate children of an interpolated Sequence in ContentBlock"
[[claims]]
id = "immediate-child"
level = "must"
statement = "When forming a ContentBlock value, an interpolated Sequence contributes one immediate child, preserving its own children and order. Existing empty/single-child collection normalization remains; value children are not recursively flattened."
[[claims]]
id = "distinct-operations"
level = "must"
statement = "Concatenation with + and value accumulation retain their own immediate-operand rules. Markup value collection cannot simulate recursive concatenation or change aliases, Source or Styled/Located/Realized/ShowRecipe bodies. Realized flow composition keeps its normalization and causal-capture path."