tekt = 1
kind = "nucleus"
id = "content-map-change-proof"
title = "Proof of unchanged Content mapping"
[[claims]]
id = "absence-proof"
level = "must"
statement = "In mapping helpers with change proof, None certifies that neither any actually visited descendant nor the node itself required replacement or reconstruction. Some carries materialization or replacement; without sufficient proof conservative reconstruction remains permitted."
[[claims]]
id = "explicit-substitution"
level = "must"
statement = "Some returned by the callback is always explicit replacement, even when it contains an equal value or shares the argument's storage. This replacement must propagate to visited ancestors."
[[claims]]
id = "no-inferred-change"
level = "must-not"
statement = "Content equality, hashes, text or addresses cannot decide whether the callback or a descendant replaced content."
[[claims]]
id = "causal-walk"
level = "must"
statement = "Mapping preserves existing owned visit order and boundaries, visits each effective occurrence once, presents the postchildren node to the bottom-up callback, does not reprocess replacement, and stops on first error without visiting later siblings or ancestors."
[[claims]]
id = "owned-preservation"
level = "must"
statement = "Reconstruction preserves fields, metadata, spans, presence and options that the owner specifies remain unchanged. Absence of replacement permits retaining shared storage; it neither changes language observations nor suppresses callback effects."
[[claims]]
id = "lazy-vectors"
level = "must"
statement = "In slice and row maps propagating this proof, materialize the output vector only after the first proven change. Unreplaced prefix and siblings retain their shared content in the result."
[[claims]]
id = "static-ownership"
level = "must"
statement = "Content dispatch remains static and exhaustive over the closed enum. Each element's logic remains in its owning prompt's consumer; this protocol creates no public trait method, field, variant, vtable, global state, I/O or phase change."