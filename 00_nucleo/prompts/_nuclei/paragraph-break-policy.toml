tekt = 1
kind = "nucleus"
id = "paragraph-break-policy"
title = "Lexical hyphenation-policy validation and resolution"
[[claims]]
id = "hyphenate-domain"
level = "must"
statement = "text.hyphenate accepts boolean or auto; other types produce a causal error before configured-body materialization."
[[claims]]
id = "justify-domain"
level = "must"
statement = "par.justify accepts boolean only; auto is not a value of this property."
[[claims]]
id = "lexical-policy"
level = "must"
statement = "Explicit text.hyphenate wins; auto/absence resolves to nearest lexical par.justify, default false."
[[claims]]
id = "phase-boundary"
level = "must"
statement = "Eval validates/transports through existing lexical style; hyphenation decision belongs to private layout selector. This policy needs no public TextStyle field."
[[claims]]
id = "diagnostic-type-names"
level = "must"
statement = "Cast diagnostics use long names boolean, integer and string; public type identities bool, int and str remain unchanged."