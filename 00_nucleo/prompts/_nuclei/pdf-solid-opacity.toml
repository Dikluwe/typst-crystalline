tekt = 1
kind = "nucleus"
id = "pdf-solid-opacity"
title = "PDF solid opacity and graphics scope"
[[claims]]
id = "leaf-alpha"
level = "must"
statement = "Solid opacity uses converted-color f32 alpha without u8 quantization; resource names/pairs follow one helper. Fill/stroke independent;text uses both for faux-bold. Gradients/tiling use no representative alpha."
[[claims]]
id = "isolation"
level = "must"
statement = "Alpha state never leaks among leaves,canvas or cells. In ActualText,deferred graphic restoration stays after semantic closure; page/cell resources cover all used operators."