tekt = 1
kind = "nucleus"
id = "compilation-metric-cache"
title = "Metrics retention per compilation and World"
[[claims]]
id = "scope"
level = "must"
statement = "Share the existing metrics handle only within one compilation and the same World. A session may transfer the handle with its accepted complete candidate to the same compilation's coordinator, retaining the same World borrow. Compilation end terminates retention; never retain the handle between edits or compilations."
[[claims]]
id = "candidate-isolation"
level = "must"
statement = "Metrics sharing does not share content, frames, introspector, positions, contextual snapshots or callback stores/transcripts. Each candidate retains its inputs, effects, diagnostics and budget; metrics results obey existing font-owner keys."