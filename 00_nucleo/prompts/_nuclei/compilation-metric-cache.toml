tekt = 1
kind = "nucleus"
id = "compilation-metric-cache"
title = "Retenção de métricas por compilação e World"

[[claims]]
id = "scope"
level = "must"
statement = "Compartilhar o handle existente de métricas somente dentro de uma compilação e do mesmo World. A sessão pode transferir o handle junto do candidato completo aceito ao coordenador da mesma compilação, mantendo o empréstimo do mesmo World. O fim da compilação encerra a retenção; não manter o handle entre edições ou compilações."

[[claims]]
id = "candidate-isolation"
level = "must"
statement = "Compartilhamento de métricas não compartilha conteúdo, frames, introspector, posições, snapshots contextuais ou stores/transcripts de callbacks. Cada candidato conserva seus inputs, efeitos, diagnósticos e budget; resultados de métricas obedecem às chaves dos owners de fontes existentes."
