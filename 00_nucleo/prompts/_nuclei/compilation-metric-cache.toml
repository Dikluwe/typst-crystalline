tekt = 1
kind = "nucleus"
id = "compilation-metric-cache"
title = "Metrics retention per compilation and World"
[[claims]]
id = "scope"
level = "must"
statement = "For the existing borrowed metrics-handle optimization, share that handle only within one compilation and the same World. A session may transfer the handle with its accepted complete candidate to the same compilation's coordinator, retaining the same World borrow. Compilation end terminates retention of that handle; never prolong its World borrow between edits or compilations. This scoped optimization does not certify or universally prohibit a separately owned cross-compilation product; such a product requires its own complete validity and lifetime contract."
[[claims]]
id = "candidate-isolation"
level = "must"
statement = "This metrics-handle optimization grants no sharing of content, frames, introspector, positions, contextual snapshots or callback stores/transcripts. Each candidate retains its inputs, effects, diagnostics and budget; metrics results obey existing font-owner keys."