tekt = 1
kind = "nucleus"
id = "introspection-content-snapshot"
title = "Frozen public fields of introspected content"
[[claims]]
id = "authoritative-presence"
level = "must"
statement = "A present snapshot is the complete ordered public-field sequence of the realized family, with unique names; absent snapshot retains legacy projection. A present snapshot has no per-field fallback."
[[claims]]
id = "immutable-causal-transport"
level = "must"
statement = "Queried value carries the immutable snapshot of its producing occurrence; clone, arrays, closures and method dispatch preserve it after style/context changes."
[[claims]]
id = "no-reconstruction"
level = "must-not"
statement = "Consumers of present snapshots do not reconstruct fields from current style, body equality, hash, selector label or first occurrence. Snapshot absence retains only explicitly contracted legacy fallbacks. Encoders execute no callbacks or content realization."
[[claims]]
id = "separate-render-datum"
level = "must"
statement = "Render tree and field snapshot are separate data. Only explicit render conversion may discard the snapshot without changing original value; new introspection builds a coherent new entry."
[[claims]]
id = "function-and-label"
level = "must"
statement = "A present snapshot contains neither func nor location. Element function projects separately. Within snapshot, present causal label is last; absent label is not replaced by none, selector or synthetic TOC label. Families without snapshots retain their explicitly contracted legacy label projection."
[[claims]]
id = "identity-not-equality"
level = "must"
statement = "Location preserves exact occurrence identity but is not part of Content language equality. Label is likewise excluded; realized public fields may participate under their owning equality contract."
[[claims]]
id = "single-entry"
level = "must"
statement = "The canonical element store keeps content tree and optional snapshot in one entry, without a competing second public-field store."