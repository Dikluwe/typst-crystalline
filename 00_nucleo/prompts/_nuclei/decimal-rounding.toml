tekt = 1
kind = "nucleus"
id = "decimal-rounding"
title = "Decimal rounding of finite floats"
[[claims]]
id = "identity"
level = "must"
statement = "For a finite f64 operand, precision >=15 preserves the value; precision >=0 also preserves magnitudes >=2^53, without an intermediate product that could overflow."
[[claims]]
id = "coarse-zero"
level = "must"
statement = "For a finite f64 operand and precision <-308, the result is zero with the operand's sign."
[[claims]]
id = "scaling"
level = "must"
statement = "In other finite cases, round half away from zero: positive precision scales by multiplication before and division afterward; nonpositive precision scales by division before and multiplication afterward. Compute the decimal factor with the project-pinned pure libm::exp10 function."
[[claims]]
id = "nonfinite-policy"
level = "must-not"
statement = "Sharing finite-operand rules does not unify nonfinite-input or actual-result-overflow policy; each owning prompt retains its behavior-specific policy."