tekt = 1
kind = "nucleus"
id = "compiler-feature-gates"
title = "Gates de features do compilador"

[[claims]]
id = "empty-default"
level = "must"
statement = "O conjunto efetivo de features do compilador é vazio quando nenhum pedido explícito é fornecido."

[[claims]]
id = "explicit-enable"
level = "must"
statement = "Cada feature é ativada somente pelo seu nome em um pedido explícito; features independentes não se ativam mutuamente."

[[claims]]
id = "target-orthogonality"
level = "must-not"
statement = "Selecionar target, formato ou exporter ativa implicitamente qualquer feature do compilador."

[[claims]]
id = "gated-binding-absence"
level = "must"
statement = "Um binding gated não existe na superfície da linguagem quando a feature correspondente está desligada."

[[claims]]
id = "disabled-no-parity-credit"
level = "must-not"
statement = "Um caso desligado pelo perfil recebe crédito de MATCH, Preserved ou igualdade exercitada."

[[claims]]
id = "active-incapability"
level = "must"
statement = "Incapacidade, execução opaca ou ausência do binding no perfil que ativa a feature resulta em Unknown ou Violated, nunca em sucesso nem em desligado pelo perfil."
