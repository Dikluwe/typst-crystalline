tekt = 1
kind = "nucleus"
id = "compiler-feature-gates"
title = "Compiler feature gates"
[[claims]]
id = "empty-default"
level = "must"
statement = "The effective compiler feature set is empty when no explicit request is supplied."
[[claims]]
id = "explicit-enable"
level = "must"
statement = "Each feature is enabled only by its name in an explicit request; independent features do not enable one another."
[[claims]]
id = "target-orthogonality"
level = "must-not"
statement = "Selecting a target, format or exporter implicitly enables any compiler feature."
[[claims]]
id = "gated-binding-absence"
level = "must"
statement = "A gated binding is absent from the language surface when its corresponding feature is disabled."
[[claims]]
id = "disabled-no-parity-credit"
level = "must-not"
statement = "A profile-disabled case receives MATCH, Preserved or exercised-equality credit."
[[claims]]
id = "active-incapability"
level = "must"
statement = "Inability, opaque execution or missing binding under a profile that enables the feature results in Unknown or Violated, never success or profile-disabled status."