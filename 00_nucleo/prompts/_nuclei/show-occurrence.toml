kind = "nucleus"
id = "show-occurrence"
title = "Proteção privada de receitas por ocorrência na realização"

[[claims]]
id = "session-state"
level = "must"
statement = "A realização corrente possui proteção por par Location/RuleId e profundidade de expansão privada em EvalContext, inicializadas vazias/zero por instância. Aliases conservam proteção e produtos concluídos; ocorrências novas permanecem elegíveis. Não usar estado global, campos públicos novos ou igualdade morfológica para terminar geração de localizáveis."
