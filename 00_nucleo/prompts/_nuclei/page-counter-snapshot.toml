tekt = 1
kind = "nucleus"
id = "page-counter-snapshot"
title = "Realized page-counter state per occurrence and document"
[[claims]]
id = "document-scope"
level = "must"
statement = "Each Page snapshot belongs to one document/generation. Occurrence current/final inherits neither updates nor total from neighboring documents. HTML consumes no physical pages of paged documents."
[[claims]]
id = "realized-fold"
level = "must"
statement = "Realized state combines Page init, actually inserted updates in causal order and document physical advances. A later update does not change prior current reads; final includes later updates and final pages without occurrences. Never derive final solely from page count or PageStore's last logical_number."
[[claims]]
id = "snapshot-lifecycle"
level = "must"
statement = "Current/final are produced together from same contribution, positions and document partition. Replacing/invalidating content, position, document or callback invalidates generation; partial snapshots never certify stability. Replay uses original-read formula. Do not reduce stabilization budget in this correction."
[[claims]]
id = "domain-boundary"
level = "must"
statement = "L1 folds states and executes callbacks through already injected Engine without I/O/global state. L3 supplies realized boundaries/positions and composes generations without duplicating CounterUpdate formula. Page snapshots never replace original shaping/export sources."