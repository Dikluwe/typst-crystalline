[workspace]
resolver = "2"
members = [
    "01_core",
    "02_shell",
    "03_infra",
    "04_wiring",
    "benches",
    # lab/typst-original não é membro do workspace cristalino
    # compile separadamente se necessário para testes de paridade
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["Typst GmbH <hi@typst.app>"]
license     = "Apache-2.0"
repository  = "https://github.com/typst/typst"

[workspace.dependencies]
thiserror  = "2"
comemo     = "0.4"
rustc-hash = "2"    # ADR-0018 — hashing eficiente em L1 (revoga ADR-0007)
ttf-parser  = "0.25"  # ADR-0019 — parsing de fontes OpenType/TrueType em L3
rustybuzz   = "0.20"  # ADR-0019 — shaping de texto em L3
time        = { version = "0.3", features = ["macros", "formatting", "parsing", "local-offset"] }  # ADR-0021 — Datetime
indexmap    = { version = "2", features = [] }            # ADR-0023 — ordem de inserção em Scope
ecow      = "0.2"   # L3 apenas — fronteira; não entra em L1 (ADR-0004 Opção C)
anyhow    = "1"
clap      = { version = "4", features = ["derive", "env"] }  # ADR-0047 — argparsing; Passo 123 activa "env" para TYPST_ROOT/TYPST_FONT_PATHS
clap_complete = "4.5.44"
codespan-reporting = "0.11.1" # P1139 — formatter humano igual ao vanilla ratificado
# grupo Unicode — ADR-0010 a ADR-0013
unicode-bidi         = "0.3"   # P484 — bidi algorithm para re-order de runs RTL (ADR-0120 Fase 3)
unicode-ident        = "1"
unicode-math-class   = "0.1"
unicode-script       = "0.5"
unicode-segmentation = "1"
unicode-normalization= "0.1"   # P692 — str.normalize() em L1 (NFC/NFD/NFKC/NFKD); já transitiva via hayagriva
icu_segmenter        = { version = "2.2.0", features = ["compiled_data", "lstm"] }  # P756 — segmentação de linha CJK/Thai (sem I/O)
hypher               = "0.1"   # ADR-0057 — hyphenation patterns embebidos (no_std, zero deps)
regex                = "1"     # ADR-0077 — `Selector::Regex` em L1 (M9c P209D); full Unicode
# grupo loading (data import) — ADR-0111 (P387); decode puro em L1, paridade do Value de saída
serde                = "1"
serde_json           = { version = "1", features = ["preserve_order"] }  # dict ordem-de-inserção (paridade Typst IndexMap)
saphyr               = "0.0.6" # YAML mantido (serde_yaml arquivada, serde_yml DEPRECATED); mapa Yaml→Value manual
toml                 = { version = "0.8", features = ["preserve_order"] }
ciborium             = "0.2"   # CBOR puro-Rust sem C
roxmltree            = "0.20"  # XML read-only
csv                  = "1"
rust_decimal         = { version = "1", features = ["maths"] }   # ADR-0112 (P399) — Decimal precisão fixa em L1; P817 — feature `maths` para `checked_powi` (paridade `calc.pow(decimal, int)`)
hayagriva            = "0.10"  # P418 — parsing bibliográfico + CSL engine

# fontes embutidas — P753 (paridade com vanilla CLI)
typst-assets         = { git = "https://github.com/typst/typst-assets", rev = "c0ae970", features = ["fonts"] }

# benchmarking — ADR-0115 (P441)
criterion            = "0.5"

# download de pacotes @preview — P763a
ureq                 = "2.12"   # cliente HTTP síncrono (mesmo padrão do vanilla)
rustls                = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types      = "1.15"
webpki-roots          = "0.26"
tar                  = "0.4"    # extracção de pacotes .tar.gz
fastrand             = "2.2"    # nomes de directórios temporários atómicos

# syntax highlighting — P785a (paridade raw com vanilla CLI)
syntect              = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "plist-load", "yaml-load"] }
two-face             = { version = "0.4.3", default-features = false, features = ["syntect-fancy"] }

# lorem byte-parity — P805 (mesma crate do vanilla: Markov chain determinística)
lipsum               = "0.9.1"
