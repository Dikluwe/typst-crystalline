[package]
name        = "typst-core"
description = "Pure domain logic for the Typst compiler"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
thiserror            = { workspace = true }
comemo               = { workspace = true }
rustc-hash           = { workspace = true }  # ADR-0018
# grupo Unicode — ADR-0010 a ADR-0013
unicode-ident        = { workspace = true }
unicode-math-class   = { workspace = true }
unicode-script       = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-normalization= { workspace = true }  # P692 — str.normalize() (NFC/NFD/NFKC/NFKD)
icu_segmenter        = { workspace = true }  # P756 — segmentação de linha CJK/Thai (dados estáticos, sem I/O)
time                 = { workspace = true }  # ADR-0021 — Datetime real
indexmap             = { workspace = true }  # ADR-0023 — Scope com ordem de inserção
ecow                 = { workspace = true }  # ADR-0024 — EcoString em Value::Str
hypher               = { workspace = true }  # ADR-0057 — hyphenation patterns no_std, zero deps
regex                = { workspace = true }  # ADR-0077 — Selector::Regex em L1 (P209D / M9c)
# grupo loading (data import) — ADR-0111 (P387)
serde                = { workspace = true }
serde_json           = { workspace = true }
saphyr               = { workspace = true }
toml                 = { workspace = true }
ciborium             = { workspace = true }
roxmltree            = { workspace = true }
csv                  = { workspace = true }
rust_decimal         = { workspace = true }  # ADR-0112 (P399) — Decimal precisão fixa em L1
hayagriva            = { workspace = true }  # P418 — parsing bibliográfico + CSL engine
syntect              = { workspace = true }  # P785a — syntax highlighting em blocos raw
two-face             = { workspace = true }  # P785a — conjunto de sintaxes e temas para syntect
lipsum               = { workspace = true }  # P805 — lorem byte-parity (Markov chain do vanilla, MIT)
codex                = { workspace = true }  # P1283 — dados Unicode declarativos, puros e estáticos
memmap2              = "0.9"                 # P937 — Font::Mmap em L1 (referência estável de bytes; criação apenas em L3)
libm                 = "=0.2.11"             # P1253 — versão exata usada por palette no baseline
