path = "pipeline_bench.rs"
harness = false

[[bench]]
name = "layout_bench"
path = "layout_bench.rs"
harness = false

[[bench]]
name = "stream_bench"
path = "stream_bench.rs"
harness = false

[[bench]]
name = "observation_bench"
path = "observation_bench.rs"
